      person: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"/><path d="M6.5 20c.5-4 2.3-6 5.5-6s5 2 5.5 6"/></svg>`,
      pin: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>`,
      course: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-5 9 5-9 5-9-5Z"/><path d="M7 12v5c3 2 7 2 10 0v-5"/><path d="M21 9v6"/></svg>`,
      seminar: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v18M12 8h4M12 12h4M12 16h3"/></svg>`,
      lab: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M8 15h8"/></svg>`
    };

    const initialData = {
      times: [
        ['08:00','09:30'],['09:40','11:10'],['11:20','12:50'],['13:00','14:30'],
        ['14:40','16:10'],['16:20','17:50'],['18:00','19:30'],['19:40','21:10']
      ],
      classes: {
        '0-0': {type:'CURS', subject:'Algebra liniară', professor:'ȚÎNCU Ioan', location:'B403', note:'', deadline:''},
        '0-2': {type:'CURS', subject:'Limbaje de programare', professor:'PITIC Antoniu Gabriel', location:'AUMOVIO_Aula', week:'PARĂ', note:'', deadline:''},
        '0-3': {type:'LABORATOR', subject:'Fizica', professor:'BÎRSAN Eugen', location:'B009-Fizica', week:'PARĂ', note:'', deadline:''},

        '1-0': {type:'CURS', subject:'Fizica', professor:'BÎRSAN Eugen', location:'B403', note:'', deadline:''},
        '1-1': {type:'SEMINAR', subject:'Analiza matematică', professor:'ȚÎNCU Ioan', location:'Sala A16 · Corp A', note:'', deadline:''},
        '1-2': {type:'CURS', subject:'Limbaje de programare', professor:'PITIC Antoniu Gabriel', location:'AUMOVIO_Aula', note:'', deadline:''},
        '1-3': {type:'SEMINAR', subject:'Algebra liniară', professor:'ȚÎNCU Ioan', location:'Sala A16 · Corp A', note:'', deadline:''},

        '2-0': {type:'CURS', subject:'Bazele programării calculatoarelor', professor:'FLOREA Adrian', location:'B403', note:'', deadline:''},
        '2-1': {type:'CURS', subject:'Analiza matematică', professor:'ȚÎNCU Ioan', location:'Sala A17 · Corp A', note:'', deadline:''},
        '2-2': {type:'CURS', subject:'Informatica aplicată', professor:'BRAD Raluca Irina', location:'AUMOVIO_Aula', note:'', deadline:''},
        '2-3': {type:'LABORATOR', subject:'Informatica aplicată', professor:'BRAD Raluca Irina', location:'IE005', note:'', deadline:''},

        '3-3': {type:'SEMINAR', subject:'Limba germană', professor:'GINGHINA Elena', location:'IE101', note:'', deadline:''},
        '4-3': {type:'SEMINAR', subject:'Limba engleză', professor:'TEODORESCU Andreea Maria', location:'Litere', note:'', deadline:''},

        '6-1': {type:'LABORATOR', subject:'Limbaje de programare', professor:'TECU Alexandru', location:'IE005', note:'', deadline:''},
        '7-1': {type:'SEMINAR', subject:'Bazele programării calculatoarelor', professor:'PAUNESCU Georgiana Malvina', location:'IE303', note:'', deadline:''}
      }
    };

    function storageGet(key){
      try{return localStorage.getItem(key);}catch(e){return null;}
    }

    function storageSet(key,value){
      try{localStorage.setItem(key,value);return true;}catch(e){return false;}
    }

    let data = loadData();
    Object.values(data.classes).forEach(item => {
      if(!item) return;
      if(!item.week) item.week = item.pair ? 'PARĂ' : 'MEREU';
      if(typeof item.deadline !== 'string') item.deadline = '';
      delete item.pair;
      delete item.noteKind;
    });
    let selectedWeek = storageGet('c11_1_selected_week') === 'IMPARĂ' ? 'IMPARĂ' : 'PARĂ';
    let editing = false;
    let expandedKey = null;
    let selectedDay = Number(storageGet('c11_1_selected_day') || 0);
    if (!Number.isInteger(selectedDay) || selectedDay < 0 || selectedDay > 4) selectedDay = 0;

    const grid = document.getElementById('scheduleGrid');
    const editToggle = document.getElementById('editToggle');
    const saveState = document.getElementById('saveState');
    const mobileTabs = document.getElementById('mobileTabs');
    const toast = document.getElementById('toast');
    let toastTimer;
    let saveTimer;

    function clone(obj){ return JSON.parse(JSON.stringify(obj)); }

    function loadData(){
      try{
        const raw = storageGet(STORAGE_KEY);
        if(!raw) return clone(initialData);
        const parsed = JSON.parse(raw);
        if(!parsed || !Array.isArray(parsed.times) || typeof parsed.classes !== 'object') return clone(initialData);
        Object.values(parsed.classes).forEach(item => {
          if(!item) return;
          if(!item.week) item.week = item.pair ? 'PARĂ' : 'MEREU';
          if(typeof item.deadline !== 'string') item.deadline = '';
          delete item.pair;
          delete item.noteKind;
        });
        return parsed;
      }catch(e){
        return clone(initialData);
      }
    }

    function saveData(message='Salvat'){
      storageSet(STORAGE_KEY, JSON.stringify(data));
      if(saveState){
        saveState.textContent = '';
      }
      clearTimeout(saveTimer);
    }

    function showToast(message){
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1700);
    }

    function escapeHtml(value=''){
      return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    }

    function typeIcon(type){
      if(type === 'LABORATOR') return ICONS.lab;
      if(type === 'SEMINAR') return ICONS.seminar;
      return ICONS.course;
    }

    function todayISO(){
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    }

    function noteState(item){
      if(!item || !(item.note || '').trim()) return '';
      const deadline = (item.deadline || '').trim();
      if(!deadline) return 'has-note';
      const today = todayISO();
      if(deadline < today) return 'has-note note-overdue';
      if(deadline === today) return 'has-note note-due-today';
      return 'has-note';
    }

    function noteDotTitle(item){
      if(!item || !(item.note || '').trim()) return '';
      const deadline = (item.deadline || '').trim();
      if(!deadline) return 'Ai ceva de făcut';
      const today = todayISO();
      if(deadline < today) return `Termen depășit: ${deadline}`;
      if(deadline === today) return `Termen astăzi: ${deadline}`;
      return `Termen: ${deadline}`;
    }

    function renderTabs(){
      mobileTabs.innerHTML = DAYS.map((day,i) =>
        `<button class="day-tab ${i===selectedDay?'active':''}" data-day="${i}" type="button">${day}</button>`
      ).join('');
      document.body.classList.remove('mobile-day-0','mobile-day-1','mobile-day-2','mobile-day-3','mobile-day-4');
      document.body.classList.add(`mobile-day-${selectedDay}`);
    }

    function render(){
      renderTabs();
      document.body.dataset.week = selectedWeek;
      document.getElementById('weekLabel').textContent = selectedWeek;
      document.getElementById('weekToggle').setAttribute('aria-label', `Săptămâna ${selectedWeek}. Afișează săptămâna ${oppositeWeek(selectedWeek)}`);
      let html = `<div class="head-cell time-head">ORA</div>`;
      DAYS.forEach((day,i) => html += `<div class="head-cell day-col day-${i}">${day}</div>`);

      data.times.forEach((time,row) => {
        html += renderTimeCell(time,row);
        DAYS.forEach((_,day) => {
          const key = `${row}-${day}`;
          const item = activeItem(key);
          html += renderSlot(item,key,day);
        });
      });
      grid.innerHTML = html;
      attachDynamicHandlers();
    }

    function renderTimeCell(time,row){
      if(editing){
        return `<div class="time-cell">
          <div class="time-edit">
            <input type="time" value="${escapeHtml(time[0])}" data-time-row="${row}" data-time-part="0" aria-label="Ora de început">
            <input type="time" value="${escapeHtml(time[1])}" data-time-row="${row}" data-time-part="1" aria-label="Ora de sfârșit">
          </div>
        </div>`;
      }
      return `<div class="time-cell"><div>${escapeHtml(time[0])}</div><div>${escapeHtml(time[1])}</div></div>`;
    }

    function renderSlot(item,key,day){
      if(!item){
        return `<div class="slot-cell empty day-col day-${day}" data-key="${key}">
          ${editing ? `<button class="add-class" type="button" data-add="${key}">＋ Adaugă${data.classes[key] ? ' · '+selectedWeek : ''}</button>` : ''}
        </div>`;
      }
      return `<div class="slot-cell day-col day-${day} ${(!editing && expandedKey === key) ? 'note-open-slot' : ''}" data-key="${key}">${renderCard(item,key)}</div>`;
    }

    function oppositeWeek(week){return week === 'PARĂ' ? 'IMPARĂ' : 'PARĂ';}

    function activeItem(key){
      const item = data.classes[key];
      if(!item) return null;
      if(item.week === 'MEREU' || item.week === selectedWeek) return item;
      return item.alternate && item.alternate.week === selectedWeek ? item.alternate : null;
    }

    let gridMotion;
    function animateSchedule(direction=0){
      if(!grid.animate || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
      if(gridMotion) gridMotion.cancel();
      const from = direction === 1 ? 'translateX(24px)' : direction === -1 ? 'translateX(-24px)' : 'translateY(4px)';
      gridMotion = grid.animate([
        {opacity:.35,transform:from},
        {opacity:1,transform:'translate(0,0)'}
      ],{duration:210,easing:'cubic-bezier(.2,.8,.2,1)'});
    }

    let dayTransitionId = 0;

    async function changeDay(nextDay){
      if(nextDay === selectedDay) return;

      const transitionId = ++dayTransitionId;
      const forward = nextDay > selectedDay;
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if(gridMotion){
        try{ gridMotion.cancel(); }catch(e){}
        gridMotion = null;
      }

      if(grid.animate && !reduce){
        const outX = forward ? '-105%' : '105%';
        const outgoing = grid.animate([
          {transform:'translateX(0)',opacity:1},
          {transform:`translateX(${outX})`,opacity:1}
        ],{
          duration:180,
          easing:'cubic-bezier(.55,.05,.85,.35)',
          fill:'forwards'
        });

        gridMotion = outgoing;

        try{ await outgoing.finished; }catch(e){}

        if(transitionId !== dayTransitionId) return;

        // Remove the fill:forwards transform before rendering the new day.
        try{ outgoing.cancel(); }catch(e){}
        if(gridMotion === outgoing) gridMotion = null;
      }

      if(transitionId !== dayTransitionId) return;

      selectedDay = nextDay;
      expandedKey = null;
      storageSet('c11_1_selected_day', selectedDay);
      render();

      if(grid.animate && !reduce){
        const inX = forward ? '105%' : '-105%';
        const incoming = grid.animate([
          {transform:`translateX(${inX})`,opacity:1},
          {transform:'translateX(0)',opacity:1}
        ],{
          duration:230,
          easing:'cubic-bezier(.16,1,.3,1)'
        });

        gridMotion = incoming;
        incoming.finished.then(() => {
          if(gridMotion === incoming) gridMotion = null;
        }).catch(() => {});
      }
    }

    let weekFadeMotions = [];

    function parityAffectedKeys(){
      return Object.keys(data.classes).filter(key => {
        const root = data.classes[key];
        if(!root) return false;
        const rootParity = root.week && root.week !== 'MEREU';
        const altParity = root.alternate && root.alternate.week && root.alternate.week !== 'MEREU';
        return Boolean(rootParity || altParity);
      });
    }

    async function selectWeek(week){
      if(week === selectedWeek) return;

      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      weekFadeMotions.forEach(m => { try{ m.cancel(); }catch(e){} });
      weekFadeMotions = [];

      const affectedKeys = parityAffectedKeys();

      if(!reduce){
        affectedKeys.forEach(key => {
          const card = grid.querySelector(`[data-key="${key}"] .class-card`);
          if(!card || !card.animate) return;
          const motion = card.animate(
            [
              {opacity:1,transform:'translateY(0) scale(1)'},
              {opacity:0,transform:'translateY(-5px) scale(.985)'}
            ],
            {duration:120,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'}
          );
          weekFadeMotions.push(motion);
        });
        if(weekFadeMotions.length){
          await Promise.allSettled(weekFadeMotions.map(m => m.finished));
        }
      }

      selectedWeek = week;
      storageSet('c11_1_selected_week',week);
      expandedKey = null;
      render();

      weekFadeMotions = [];
      if(!reduce){
        affectedKeys.forEach(key => {
          const card = grid.querySelector(`[data-key="${key}"] .class-card`);
          if(!card || !card.animate) return;
          const motion = card.animate(
            [
              {opacity:0,transform:'translateY(6px) scale(.985)'},
              {opacity:1,transform:'translateY(0) scale(1)'}
            ],
            {duration:180,easing:'cubic-bezier(.16,1,.3,1)'}
          );
          weekFadeMotions.push(motion);
        });
        Promise.allSettled(weekFadeMotions.map(m => m.finished)).then(() => {
          weekFadeMotions = [];
        });
      }
    }

    function isLandscapePhone(){
      return Boolean(window.matchMedia && window.matchMedia('(max-width:900px) and (orientation:landscape)').matches);
    }

    let noteToggleMotionId = 0;

    async function toggleNoteCard(key){
      const motionId = ++noteToggleMotionId;
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const landscape = isLandscapePhone();
      const opening = expandedKey !== key;

      if(!landscape || reduce){
        expandedKey = opening ? key : null;
        render();
        if(expandedKey){
          requestAnimationFrame(() => {
            const area = grid.querySelector(`[data-note="${expandedKey}"]`);
            if(area) area.focus({preventScroll:true});
          });
        }
        return;
      }

      if(!opening){
        const slot = grid.querySelector(`[data-key="${key}"]`);
        const card = slot && slot.querySelector('.class-card');
        const panel = card && card.querySelector('.note-panel');
        if(!slot || !card){
          expandedKey = null;
          render();
          return;
        }

        const startHeight = slot.getBoundingClientRect().height;
        const baseHeight = parseFloat(getComputedStyle(grid).getPropertyValue('--row-height')) || 92;

        slot.style.overflow = 'hidden';
        card.style.overflow = 'hidden';

        const animations = [];
        if(slot.animate) animations.push(slot.animate(
          [{height:`${startHeight}px`},{height:`${baseHeight}px`}],
          {duration:240,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}
        ));
        if(card.animate) animations.push(card.animate(
          [{height:`${startHeight}px`},{height:`${baseHeight}px`}],
          {duration:240,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}
        ));
        if(panel && panel.animate) animations.push(panel.animate(
          [{opacity:1,transform:'translateY(0) scaleY(1)'},{opacity:0,transform:'translateY(-7px) scaleY(.94)'}],
          {duration:165,easing:'ease-in',fill:'forwards'}
        ));

        if(animations.length) await Promise.allSettled(animations.map(a => a.finished));
        if(motionId !== noteToggleMotionId) return;

        expandedKey = null;
        render();
        return;
      }

      // Keep only one notes card open. If another one is open, close it before opening this one.
      if(expandedKey && expandedKey !== key){
        expandedKey = null;
        render();
      }

      const oldSlot = grid.querySelector(`[data-key="${key}"]`);
      const baseHeight = oldSlot ? oldSlot.getBoundingClientRect().height : (parseFloat(getComputedStyle(grid).getPropertyValue('--row-height')) || 92);

      expandedKey = key;
      render();

      const slot = grid.querySelector(`[data-key="${key}"]`);
      const card = slot && slot.querySelector('.class-card');
      const panel = card && card.querySelector('.note-panel');
      if(!slot || !card) return;

      const targetHeight = Math.max(baseHeight, card.scrollHeight);

      slot.style.height = `${baseHeight}px`;
      slot.style.overflow = 'hidden';
      card.style.height = `${baseHeight}px`;
      card.style.overflow = 'hidden';

      // Force the starting height to be committed before the expansion animation.
      slot.getBoundingClientRect();

      const animations = [];
      if(slot.animate) animations.push(slot.animate(
        [{height:`${baseHeight}px`},{height:`${targetHeight}px`}],
        {duration:270,easing:'cubic-bezier(.16,1,.3,1)'}
      ));
      if(card.animate) animations.push(card.animate(
        [{height:`${baseHeight}px`},{height:`${targetHeight}px`}],
        {duration:270,easing:'cubic-bezier(.16,1,.3,1)'}
      ));
      if(panel && panel.animate) animations.push(panel.animate(
        [{opacity:0,transform:'translateY(-8px) scaleY(.94)'},{opacity:1,transform:'translateY(0) scaleY(1)'}],
        {duration:230,easing:'cubic-bezier(.16,1,.3,1)'}
      ));

      if(animations.length) await Promise.allSettled(animations.map(a => a.finished));
      if(motionId !== noteToggleMotionId) return;

      slot.style.height = '';
      slot.style.overflow = '';
      card.style.height = '';
      card.style.overflow = '';

      requestAnimationFrame(() => {
        const area = grid.querySelector(`[data-note="${key}"]`);
        if(area) area.focus({preventScroll:true});
      });
    }

    function renderCard(item,key){
      const noteExists = Boolean((item.note || '').trim());
      const noteClass = noteState(item);
      const open = !editing && expandedKey === key;
      if(editing){
        return `<article class="class-card ${noteClass}" data-card="${key}">
          <span class="note-dot" aria-hidden="true"></span>
          <button class="delete-class" type="button" data-delete="${key}" aria-label="Șterge materia">×</button>
          <div class="edit-fields">
            <div class="edit-meta">
              <span class="type-icon">${typeIcon(item.type)}</span>
              <select class="edit-select" data-field="type" data-key="${key}" aria-label="Tip activitate">
                ${['CURS','SEMINAR','LABORATOR'].map(v=>`<option value="${v}" ${item.type===v?'selected':''}>${v}</option>`).join('')}
              </select>

            </div>
            <div class="week-edit">
              <span class="week-mark">◐</span>
              <select class="edit-select" data-field="week" data-key="${key}" aria-label="Frecvență">
                ${['MEREU','PARĂ','IMPARĂ'].map(v=>`<option ${data.classes[key].alternate && v==='MEREU'?'disabled':''} value="${v}" ${(item.week || (item.pair?'PARĂ':'MEREU'))===v?'selected':''}>${v}</option>`).join('')}
              </select>
            </div>

            <input class="edit-input subject-input" data-field="subject" data-key="${key}" value="${escapeHtml(item.subject)}" aria-label="Materia">
            <div class="edit-meta">
              <span class="meta-icon">${ICONS.person}</span>
              <input class="edit-input" data-field="professor" data-key="${key}" value="${escapeHtml(item.professor)}" aria-label="Profesor">
            </div>
            <div class="edit-meta">
              <span class="meta-icon">${ICONS.pin}</span>
              <input class="edit-input" data-field="location" data-key="${key}" value="${escapeHtml(item.location)}" aria-label="Locație">
            </div>
          </div>

        </article>`;
      }

      return `<article class="class-card ${noteClass}" data-card="${key}" tabindex="0" role="button" aria-expanded="${open?'true':'false'}">
        <span class="note-dot" aria-hidden="true" title="${escapeHtml(noteDotTitle(item))}"></span>
        <div class="type-row">
          <span class="type-icon">${typeIcon(item.type)}</span>
          <span>${escapeHtml(item.type)}</span>

        </div>
        <div class="subject">${escapeHtml(item.subject)}${item.week !== 'MEREU' ? `<span class="week-tag">(${escapeHtml(item.week)})</span>` : ''}</div>
        <div class="meta-stack">
          <div class="meta-line"><span class="meta-icon">${ICONS.person}</span><span class="meta-text">${escapeHtml(item.professor)}</span></div>
          <div class="meta-line"><span class="meta-icon">${ICONS.pin}</span><span class="meta-text">${escapeHtml(item.location)}</span></div>
        </div>
        ${open ? renderNotePanel(item,key) : ''}
      </article>`;
    }

    function renderNotePanel(item,key){
      return `<div class="note-panel" data-note-panel="${key}">
        <div class="note-top">
          <span class="note-label">De făcut</span>
          <label class="deadline-wrap">
            <span class="deadline-label">Termen</span>
            <input class="deadline-input" type="date" data-deadline="${key}" value="${escapeHtml(item.deadline || '')}" aria-label="Data limită">
          </label>
        </div>
        <textarea class="note-area" data-note="${key}" placeholder="Scrie ce ai de făcut…">${escapeHtml(item.note || '')}</textarea>
      </div>`;
    }

    function attachDynamicHandlers(){
      grid.querySelectorAll('[data-card]').forEach(card => {
        if(editing) return;
        card.addEventListener('click', e => {
          if(e.target.closest('.note-panel, .week-switch')) return;
          const key = card.dataset.card;
          toggleNoteCard(key);
        });
        card.addEventListener('keydown', e => {
          if((e.key === 'Enter' || e.key === ' ') && !e.target.closest('.note-panel, .week-switch')){
            e.preventDefault();card.click();
          }
        });
      });

      grid.querySelectorAll('[data-note]').forEach(area => {
        area.addEventListener('click', e=>e.stopPropagation());
        area.addEventListener('input', e => {
          const key = e.target.dataset.note;
          const item = activeItem(key);
          item.note = e.target.value;
          saveData('Notiță salvată');
          const card = e.target.closest('.class-card');
          card.classList.remove('has-note','note-due-today','note-overdue');
          noteState(item).split(' ').filter(Boolean).forEach(cls => card.classList.add(cls));
          const dot = card.querySelector('.note-dot');
          if(dot) dot.title = noteDotTitle(item);
        });
      });

      grid.querySelectorAll('[data-deadline]').forEach(input => {
        input.addEventListener('click', e=>e.stopPropagation());
        input.addEventListener('change', e => {
          const key = e.target.dataset.deadline;
          const item = activeItem(key);
          item.deadline = e.target.value || '';
          saveData(item.deadline ? 'Termen salvat' : 'Termen eliminat');
          const card = e.target.closest('.class-card');
          card.classList.remove('has-note','note-due-today','note-overdue');
          noteState(item).split(' ').filter(Boolean).forEach(cls => card.classList.add(cls));
          const dot = card.querySelector('.note-dot');
          if(dot) dot.title = noteDotTitle(item);
        });
      });

      grid.querySelectorAll('[data-field]').forEach(control => {
        control.addEventListener('input', updateField);
        control.addEventListener('change', updateField);
      });

      grid.querySelectorAll('[data-time-row]').forEach(control => {
        control.addEventListener('input', e => {
          const row = Number(e.target.dataset.timeRow);
          const part = Number(e.target.dataset.timePart);
          data.times[row][part] = e.target.value;
          saveData('Ore salvate');
        });
      });

      grid.querySelectorAll('[data-add]').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.add;
          const existing = data.classes[key];
          const added = {type:'CURS',week:existing ? selectedWeek : 'MEREU',subject:'Materie nouă',professor:'Profesor',location:'Locație',note:'',deadline:''};
          if(existing) existing.alternate = added;
          else data.classes[key] = added;
          saveData('Activitate adăugată');
          render();
          requestAnimationFrame(() => {
            const input = grid.querySelector(`[data-key="${key}"][data-field="subject"]`);
            if(input){input.focus();input.select();}
          });
        });
      });

      grid.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.delete;
          const root = data.classes[key];
          if(activeItem(key) === root.alternate) delete root.alternate;
          else if(root.alternate) data.classes[key] = root.alternate;
          else delete data.classes[key];
          if(expandedKey === key) expandedKey = null;
          saveData('Activitate ștearsă');
          render();
        });
      });
    }

    function updateField(e){
      const key = e.target.dataset.key;
      const field = e.target.dataset.field;
      const item = activeItem(key);
      if(!item) return;
      const root = data.classes[key];
      if(field === 'week' && root.alternate){
        if(e.target.value === 'MEREU'){e.target.value = item.week;return;}
        const other = item === root ? root.alternate : root;
        other.week = oppositeWeek(e.target.value);
      }
      item[field] = e.target.value;
      if(field === 'week' && item.week !== 'MEREU'){
        selectedWeek = item.week;
        storageSet('c11_1_selected_week',selectedWeek);
      }
      saveData('Modificare salvată');
      if((field === 'type' || field === 'week') && e.type === 'change') render();
    }

    document.getElementById('weekToggle').addEventListener('click', () => selectWeek(oppositeWeek(selectedWeek)));

    editToggle.addEventListener('click', () => {
      editing = !editing;
      expandedKey = null;
      document.body.classList.toggle('editing', editing);
      editToggle.setAttribute('aria-pressed', String(editing));
      editToggle.setAttribute('aria-label', editing ? 'Oprește modul de editare' : 'Activează modul de editare');
      render();
      animateSchedule();
      showToast(editing ? 'Mod editare activ' : 'Mod vizualizare activ');
      if(!editing && pendingAppUpdate) location.reload();
    });

    mobileTabs.addEventListener('click', e => {
      const btn = e.target.closest('[data-day]');
      if(!btn) return;
      const nextDay = Number(btn.dataset.day);
      if(selectedDay === nextDay) return;
      changeDay(nextDay);
    });



    render();

    let pendingAppUpdate = false;
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        const hadController = Boolean(navigator.serviceWorker.controller);
        let reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if(!hadController || reloading) return;
          if(editing){pendingAppUpdate = true;return;}
          reloading = true;
          location.reload();
        });
        navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}).then(registration => {
          registration.update().catch(() => {});
          document.addEventListener('visibilitychange', () => {
            if(document.visibilityState === 'visible') registration.update().catch(() => {});
          });
        }).catch(() => {});
      });
    }

  })();
  </script>
</body>
</html>
