    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 8%,rgba(255,255,255,.02),transparent 30%),
        linear-gradient(90deg,rgba(0,0,0,.08),rgba(0,0,0,.0) 18%,rgba(0,0,0,.0) 82%,rgba(0,0,0,.08));
      z-index:0;
    }

    button,input,textarea,select{font:inherit}
    button{color:inherit}
    .app{position:relative;z-index:1;min-height:100vh;padding:38px 5.8vw 92px}

    .topbar{
      position:relative;
      min-height:94px;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      text-align:center;
    }
    .title-wrap{
      padding:8px 96px 0;
      text-shadow:0 2px 16px rgba(0,0,0,.7);
    }
    h1{margin:0;font-size:clamp(31px,3vw,48px);letter-spacing:.015em;line-height:1;font-weight:900}
    .subtitle{margin-top:12px;font-size:clamp(14px,1.4vw,19px);letter-spacing:.03em;color:#edf0f6}
    .save-state{display:none}

    .edit-toggle{
      position:fixed;
      top:max(18px,env(safe-area-inset-top));
      right:max(18px,env(safe-area-inset-right));
      z-index:50;
      width:54px;height:54px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(7,10,17,.86);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      display:grid;place-items:center;
      box-shadow:0 12px 30px rgba(0,0,0,.34),inset 0 0 0 1px rgba(255,255,255,.025);
      cursor:pointer;
      transition:.2s ease;
    }
    .edit-toggle:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.32)}
    .edit-toggle[aria-pressed="true"]{
      background:linear-gradient(145deg,#a9092b,#ef1648);
      border-color:rgba(255,255,255,.35);
      box-shadow:0 0 0 5px rgba(217,19,59,.13),0 10px 35px rgba(217,19,59,.34);
    }
    .edit-toggle svg{width:23px;height:23px}

    .mobile-tabs{display:none;gap:7px;overflow:auto;padding:0 1px 12px;scrollbar-width:none}
    .mobile-tabs::-webkit-scrollbar{display:none}
    .day-tab{
      flex:0 0 auto;
      padding:9px 15px;border-radius:999px;border:1px solid rgba(255,255,255,.12);
      background:rgba(8,12,20,.88);color:#d8dce5;font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
    }
    .day-tab.active{background:linear-gradient(90deg,#9d0a27,#c91137);border-color:transparent;color:#fff}

    .schedule-shell{
      width:100%;
      max-width:1450px;
      margin:0 auto;
      border-radius:14px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(5px);
      -webkit-backdrop-filter:blur(5px);
    }
    .schedule-grid{
      display:grid;
      grid-template-columns:106px repeat(5,minmax(0,1fr));
      grid-auto-flow:row;
      gap:6px;
      align-items:stretch;
    }

    .head-cell,.time-cell,.slot-cell{
      min-width:0;
      border:1px solid var(--line);
      background:var(--panel);
      border-radius:var(--radius);
    }
    .head-cell{
      height:40px;
      display:flex;align-items:center;justify-content:center;
      text-transform:uppercase;
      font-size:12px;font-weight:800;letter-spacing:.025em;
      color:#f3eef1;
      background:linear-gradient(90deg,rgba(165,9,41,.98),rgba(188,14,48,.94));
      border-color:rgba(255,255,255,.07);
      box-shadow:inset 0 1px rgba(255,255,255,.04);
    }
    .head-cell.time-head{background:rgba(24,28,38,.97);color:#d8dbe2}

    .time-cell{
      min-height:86px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:4px;
      text-align:center;
      font-size:17px;
      color:#eef0f5;
      letter-spacing:.015em;
    }
    .time-sep{display:none}
    .time-edit{display:flex;flex-direction:column;gap:6px;width:82px}
    .time-edit input{
      width:100%;
      border:1px solid rgba(255,255,255,.13);
      border-radius:7px;
      background:rgba(255,255,255,.045);
      color:#fff;
      padding:6px 5px;
      text-align:center;
      font-size:12px;
      outline:none;
    }
    .time-edit input:focus{border-color:rgba(255,49,93,.7);box-shadow:0 0 0 3px rgba(217,19,59,.12)}

    .slot-cell{
      min-height:86px;
      position:relative;
      overflow:hidden;
      background:rgba(8,12,20,.94);
      transition:min-height .2s ease,border-color .2s ease,background .2s ease;
    }
    .slot-cell.empty{
      display:flex;align-items:center;justify-content:center;
      color:#8790a2;
      font-size:18px;
      background:rgba(7,11,18,.88);
    }
    .slot-cell.empty::before{content:"—";opacity:.62}
    body.editing .slot-cell.empty::before{display:none}

    .add-class{
      width:calc(100% - 18px);height:calc(100% - 18px);min-height:66px;
      margin:9px;
      border:1px dashed rgba(255,255,255,.18);
      border-radius:9px;
      background:rgba(255,255,255,.025);
      color:#c0c6d2;
      cursor:pointer;
      font-weight:700;
    }
    .add-class:hover{border-color:rgba(255,49,93,.58);color:#fff;background:rgba(217,19,59,.07)}

    .class-card{
      position:relative;
      min-height:84px;
      height:100%;
      padding:10px 12px 9px 14px;
      border-left:3px solid var(--accent);
      background:linear-gradient(90deg,rgba(9,14,24,.99),rgba(9,13,22,.96));
      cursor:pointer;
      user-select:none;
      transition:background .2s ease,transform .2s ease;
    }
    .class-card:hover{background:linear-gradient(90deg,rgba(13,19,31,.99),rgba(10,15,25,.97))}
    body.editing .class-card{cursor:default;user-select:auto;padding-right:38px}

    .type-row{
      display:flex;align-items:center;gap:6px;
      min-height:18px;
      color:#f55677;
      font-size:10px;
      font-weight:900;
      letter-spacing:.04em;
      text-transform:uppercase;
      white-space:nowrap;
    }
    .type-icon{display:inline-grid;place-items:center;width:14px;height:14px;flex:0 0 auto}
    .type-icon svg{width:14px;height:14px;stroke:currentColor}
    .pair-tag{color:#ff6d89}
    .pair-dot{opacity:.7}
    .week-tag{color:#ff6d89}
    .week-edit{display:grid;grid-template-columns:14px 1fr;align-items:center;gap:5px}
    .week-mark{width:12px;height:12px;display:grid;place-items:center;color:#ef4269;font-size:12px;font-weight:900}

    .subject{
      margin-top:2px;
      font-weight:850;
      font-size:14px;
      line-height:1.14;
      letter-spacing:.002em;
      color:#fafbff;
      overflow-wrap:anywhere;
    }
    .meta-stack{margin-top:9px;display:grid;gap:2px}
    .meta-line{display:flex;align-items:center;gap:5px;color:#b4bbca;font-size:10px;min-width:0;line-height:1.15}
    .meta-icon{width:12px;height:12px;color:#ef4269;flex:0 0 auto;display:grid;place-items:center}
    .meta-icon svg{width:12px;height:12px;stroke:currentColor}
    .meta-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    .note-dot{
      position:absolute;top:10px;right:10px;
      width:9px;height:9px;border-radius:50%;
      background:#fff;
      box-shadow:0 0 7px #fff,0 0 16px rgba(255,255,255,.92),0 0 28px rgba(255,255,255,.48);
      opacity:0;
      transform:scale(.45);
      transition:.2s ease;
      pointer-events:none;
    }
    .has-note .note-dot{opacity:1;transform:scale(1)}
    .has-note.note-due-today .note-dot{
      background:#ff9b38;
      box-shadow:0 0 7px #ff9b38,0 0 16px rgba(255,155,56,.92),0 0 28px rgba(255,155,56,.48);
    }
    .has-note.note-overdue .note-dot{
      background:#ff304f;
      box-shadow:0 0 7px #ff304f,0 0 16px rgba(255,48,79,.92),0 0 28px rgba(255,48,79,.48);
    }
    body.editing .note-dot{right:35px}

    .note-panel{
      margin-top:11px;
      padding-top:10px;
      border-top:1px solid rgba(255,255,255,.09);
      animation:reveal .18s ease both;
      cursor:default;
    }
    @keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
    .note-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
    .note-label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:900;color:#dce0e9}
    .deadline-wrap{
      margin-left:auto;
      display:flex;align-items:center;gap:6px;
    }
    .deadline-label{
      color:#9ca5b7;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    }
    .deadline-input{
      max-width:142px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      color:#f3f4f8;
      border-radius:7px;
      padding:5px 7px;
      font-size:10px;
      outline:none;
      color-scheme:dark;
    }
    .deadline-input:focus{border-color:rgba(255,255,255,.3);box-shadow:0 0 0 3px rgba(255,255,255,.04)}
    .note-area{
      width:100%;min-height:84px;resize:vertical;
      border:1px solid rgba(255,255,255,.11);
      background:rgba(0,0,0,.22);
      color:#fff;
      border-radius:8px;
      padding:9px 10px;
      outline:none;
      line-height:1.35;
      font-size:12px;
      user-select:text;
    }
    .note-area:focus{border-color:rgba(255,255,255,.3);box-shadow:0 0 0 3px rgba(255,255,255,.04)}
    .note-area::placeholder{color:#747d8e}

    .edit-fields{display:grid;gap:6px;margin-top:4px}
    .edit-input,.edit-select{
      width:100%;min-width:0;
      border:1px solid rgba(255,255,255,.13);
      background:rgba(255,255,255,.045);
      color:#fff;
      border-radius:7px;
      outline:none;
      padding:6px 8px;
      font-size:11px;
      line-height:1.15;
    }
    .edit-select{padding-right:26px;color:#ff7892;font-weight:900;text-transform:uppercase}
    .edit-input.subject-input{font-size:13px;font-weight:800;color:#fff}
    .edit-input:focus,.edit-select:focus{border-color:rgba(255,49,93,.72);box-shadow:0 0 0 3px rgba(217,19,59,.1)}
    .edit-meta{display:grid;grid-template-columns:14px 1fr;align-items:center;gap:5px}
    .delete-class{
      position:absolute;top:8px;right:8px;
      width:24px;height:24px;border-radius:50%;
      border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.25);
      color:#e7e9ef;cursor:pointer;display:grid;place-items:center;
      font-size:16px;line-height:1;
    }
    .delete-class:hover{background:#b30d31;border-color:#e13b60}

    .edit-banner{display:none!important}
    .reset-btn{
      border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:#fff;border-radius:7px;padding:6px 9px;cursor:pointer;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em
    }

    .footer-mark{display:flex;justify-content:center;align-items:center;margin-top:18px;opacity:.98;user-select:none}
    .footer-mark img{display:block;width:min(430px,62vw);height:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}

    .toast{
      position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,18px);
      z-index:100;pointer-events:none;
      background:rgba(8,12,20,.94);border:1px solid rgba(255,255,255,.12);color:#fff;
      border-radius:999px;padding:9px 13px;font-size:11px;opacity:0;transition:.22s ease;box-shadow:0 10px 30px rgba(0,0,0,.3)
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}

    @media (max-width:1050px){
      .app{padding-left:3.5vw;padding-right:3.5vw}

      .edit-toggle{position:fixed;z-index:9999;pointer-events:auto}
      .mobile-tabs{position:relative;z-index:20;pointer-events:auto}
      .schedule-shell,.schedule-grid,.slot-cell,.class-card{position:relative;z-index:2;pointer-events:auto}
      .mobile-tabs{display:flex;max-width:100%;margin:0 auto 4px;justify-content:flex-start}

        '4-3': {type:'SEMINAR', subject:'Limba engleză', professor:'TEODORESCU Andreea Maria', location:'Litere', note:'', deadline:''},

        '6-1': {type:'LABORATOR', subject:'Limbaje de programare', professor:'TECU Alexandru', location:'IE005', note:'', deadline:''},
        '7-1': {type:'SEMINAR', subject:'Bazele programării calculatoarelor', professor:'PAUNESCU Georgiana Malvina', location:'IE303', note:'', deadline:''}
      }
    };

    function storageGet(key){
      try{return localStorage.getItem(key);}catch(e){return null;}
    }

    function storageSet(key,value){
      try{localStorage.setItem(key,value);return true;}catch(e){return false;}
    }

    let data = loadData();
    Object.values(data.classes).forEach(item => {
      if(!item) return;
      if(!item.week) item.week = item.pair ? 'PARĂ' : 'MEREU';
      if(typeof item.deadline !== 'string') item.deadline = '';
      delete item.pair;
      delete item.noteKind;
    });
    let editing = false;
    let expandedKey = null;
    let selectedDay = Number(storageGet('c11_1_selected_day') || 0);
    if (!Number.isInteger(selectedDay) || selectedDay < 0 || selectedDay > 4) selectedDay = 0;

    const grid = document.getElementById('scheduleGrid');
    const editToggle = document.getElementById('editToggle');
    const saveState = document.getElementById('saveState');
    const mobileTabs = document.getElementById('mobileTabs');
    const toast = document.getElementById('toast');
    let toastTimer;
    let saveTimer;

    function clone(obj){ return JSON.parse(JSON.stringify(obj)); }

    function loadData(){
      try{
        const raw = storageGet(STORAGE_KEY);
        if(!raw) return clone(initialData);
        const parsed = JSON.parse(raw);
        if(!parsed || !Array.isArray(parsed.times) || typeof parsed.classes !== 'object') return clone(initialData);
        Object.values(parsed.classes).forEach(item => {
          if(!item) return;
          if(!item.week) item.week = item.pair ? 'PARĂ' : 'MEREU';
          if(typeof item.deadline !== 'string') item.deadline = '';
          delete item.pair;
          delete item.noteKind;
        });
        return parsed;
      }catch(e){
        return clone(initialData);
      }
    }

    function saveData(message='Salvat'){
      storageSet(STORAGE_KEY, JSON.stringify(data));
      if(saveState){
        saveState.textContent = '';
      }
      clearTimeout(saveTimer);
    }

    function showToast(message){
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1700);
    }

    function escapeHtml(value=''){
      return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    }

    function typeIcon(type){
      if(type === 'LABORATOR') return ICONS.lab;
      if(type === 'SEMINAR') return ICONS.seminar;
      return ICONS.course;
    }

    function todayISO(){
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    }

    function noteState(item){
      if(!item || !(item.note || '').trim()) return '';
      const deadline = (item.deadline || '').trim();
      if(!deadline) return 'has-note';
      const today = todayISO();
      if(deadline < today) return 'has-note note-overdue';
      if(deadline === today) return 'has-note note-due-today';
      return 'has-note';
    }

    function noteDotTitle(item){
      if(!item || !(item.note || '').trim()) return '';
      const deadline = (item.deadline || '').trim();
      if(!deadline) return 'Ai ceva de făcut';
      const today = todayISO();
      if(deadline < today) return `Termen depășit: ${deadline}`;
      if(deadline === today) return `Termen astăzi: ${deadline}`;
      return `Termen: ${deadline}`;
    }

    function renderTabs(){
      mobileTabs.innerHTML = DAYS.map((day,i) =>
        `<button class="day-tab ${i===selectedDay?'active':''}" data-day="${i}" type="button">${day}</button>`
      ).join('');
      document.body.classList.remove('mobile-day-0','mobile-day-1','mobile-day-2','mobile-day-3','mobile-day-4');
      document.body.classList.add(`mobile-day-${selectedDay}`);
    }

    function render(){
      renderTabs();
      let html = `<div class="head-cell time-head">ORA</div>`;
      DAYS.forEach((day,i) => html += `<div class="head-cell day-col day-${i}">${day}</div>`);

      data.times.forEach((time,row) => {
        html += renderTimeCell(time,row);
        DAYS.forEach((_,day) => {
          const key = `${row}-${day}`;
          const item = data.classes[key];
          html += renderSlot(item,key,day);
        });
      });
      grid.innerHTML = html;
      attachDynamicHandlers();
    }

    function renderTimeCell(time,row){
      if(editing){
        return `<div class="time-cell">
          <div class="time-edit">
            <input type="time" value="${escapeHtml(time[0])}" data-time-row="${row}" data-time-part="0" aria-label="Ora de început">
            <input type="time" value="${escapeHtml(time[1])}" data-time-row="${row}" data-time-part="1" aria-label="Ora de sfârșit">
          </div>
        </div>`;
      }
      return `<div class="time-cell"><div>${escapeHtml(time[0])}</div><div>${escapeHtml(time[1])}</div></div>`;
    }

    function renderSlot(item,key,day){
      if(!item){
        return `<div class="slot-cell empty day-col day-${day}" data-key="${key}">
          ${editing ? `<button class="add-class" type="button" data-add="${key}">＋ Adaugă</button>` : ''}
        </div>`;
      }
      return `<div class="slot-cell day-col day-${day}" data-key="${key}">${renderCard(item,key)}</div>`;
    }

    function renderCard(item,key){
      const noteExists = Boolean((item.note || '').trim());
      const noteClass = noteState(item);
      const open = !editing && expandedKey === key;
      if(editing){
        return `<article class="class-card ${noteClass}" data-card="${key}">
          <span class="note-dot" aria-hidden="true"></span>
          <button class="delete-class" type="button" data-delete="${key}" aria-label="Șterge materia">×</button>
          <div class="edit-fields">
            <div class="edit-meta">
              <span class="type-icon">${typeIcon(item.type)}</span>
              <select class="edit-select" data-field="type" data-key="${key}" aria-label="Tip activitate">
                ${['CURS','SEMINAR','LABORATOR'].map(v=>`<option value="${v}" ${item.type===v?'selected':''}>${v}</option>`).join('')}
              </select>
            </div>
            <div class="week-edit">
              <span class="week-mark">◐</span>
              <select class="edit-select" data-field="week" data-key="${key}" aria-label="Frecvență">
                ${['MEREU','PARĂ','IMPARĂ'].map(v=>`<option value="${v}" ${(item.week || (item.pair?'PARĂ':'MEREU'))===v?'selected':''}>${v}</option>`).join('')}
              </select>
            </div>
            <input class="edit-input subject-input" data-field="subject" data-key="${key}" value="${escapeHtml(item.subject)}" aria-label="Materia">
            <div class="edit-meta">
              <span class="meta-icon">${ICONS.person}</span>
              <input class="edit-input" data-field="professor" data-key="${key}" value="${escapeHtml(item.professor)}" aria-label="Profesor">
            </div>
            <div class="edit-meta">
              <span class="meta-icon">${ICONS.pin}</span>
              <input class="edit-input" data-field="location" data-key="${key}" value="${escapeHtml(item.location)}" aria-label="Locație">
            </div>
          </div>
        </article>`;
      }

      return `<article class="class-card ${noteClass}" data-card="${key}" tabindex="0" role="button" aria-expanded="${open?'true':'false'}">
        <span class="note-dot" aria-hidden="true" title="${escapeHtml(noteDotTitle(item))}"></span>
        <div class="type-row">
          <span class="type-icon">${typeIcon(item.type)}</span>
          <span>${escapeHtml(item.type)}</span>
          ${(item.week && item.week !== 'MEREU') ? `<span class="pair-dot">·</span><span class="week-tag">${escapeHtml(item.week)}</span>` : ''}
        </div>
        <div class="subject">${escapeHtml(item.subject)}</div>
        <div class="meta-stack">
          <div class="meta-line"><span class="meta-icon">${ICONS.person}</span><span class="meta-text">${escapeHtml(item.professor)}</span></div>
          <div class="meta-line"><span class="meta-icon">${ICONS.pin}</span><span class="meta-text">${escapeHtml(item.location)}</span></div>
        </div>
        ${open ? renderNotePanel(item,key) : ''}
      </article>`;
    }

    function renderNotePanel(item,key){
      return `<div class="note-panel" data-note-panel="${key}">
        <div class="note-top">
          <span class="note-label">De făcut</span>
          <label class="deadline-wrap">
            <span class="deadline-label">Termen</span>
            <input class="deadline-input" type="date" data-deadline="${key}" value="${escapeHtml(item.deadline || '')}" aria-label="Data limită">
          </label>
        </div>
        <textarea class="note-area" data-note="${key}" placeholder="Scrie ce ai de făcut…">${escapeHtml(item.note || '')}</textarea>
      </div>`;
    }

    function attachDynamicHandlers(){
      grid.querySelectorAll('[data-card]').forEach(card => {
        if(editing) return;
        card.addEventListener('click', e => {
          if(e.target.closest('.note-panel')) return;
          const key = card.dataset.card;
          expandedKey = expandedKey === key ? null : key;
          render();
          if(expandedKey){
            requestAnimationFrame(() => {
              const area = grid.querySelector(`[data-note="${expandedKey}"]`);
              if(area) area.focus({preventScroll:true});
            });
          }
        });
        card.addEventListener('keydown', e => {
          if((e.key === 'Enter' || e.key === ' ') && !e.target.closest('.note-panel')){
            e.preventDefault();card.click();
          }
        });
      });

      grid.querySelectorAll('[data-note]').forEach(area => {
        area.addEventListener('click', e=>e.stopPropagation());
        area.addEventListener('input', e => {
          const key = e.target.dataset.note;
          const item = data.classes[key];
          item.note = e.target.value;
          saveData('Notiță salvată');
          const card = e.target.closest('.class-card');
          card.classList.remove('has-note','note-due-today','note-overdue');
          noteState(item).split(' ').filter(Boolean).forEach(cls => card.classList.add(cls));
          const dot = card.querySelector('.note-dot');
          if(dot) dot.title = noteDotTitle(item);
        });
      });

      grid.querySelectorAll('[data-deadline]').forEach(input => {
        input.addEventListener('click', e=>e.stopPropagation());
        input.addEventListener('change', e => {
          const key = e.target.dataset.deadline;
          const item = data.classes[key];
          item.deadline = e.target.value || '';
          saveData(item.deadline ? 'Termen salvat' : 'Termen eliminat');
          const card = e.target.closest('.class-card');
          card.classList.remove('has-note','note-due-today','note-overdue');
          noteState(item).split(' ').filter(Boolean).forEach(cls => card.classList.add(cls));
          const dot = card.querySelector('.note-dot');
          if(dot) dot.title = noteDotTitle(item);
        });
      });

      grid.querySelectorAll('[data-field]').forEach(control => {
        control.addEventListener('input', updateField);
        control.addEventListener('change', updateField);
      });

      grid.querySelectorAll('[data-time-row]').forEach(control => {
        control.addEventListener('input', e => {
          const row = Number(e.target.dataset.timeRow);
          const part = Number(e.target.dataset.timePart);
          data.times[row][part] = e.target.value;
          saveData('Ore salvate');
        });
      });

      grid.querySelectorAll('[data-add]').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.add;
          data.classes[key] = {type:'CURS',week:'MEREU',subject:'Materie nouă',professor:'Profesor',location:'Locație',note:'',deadline:''};
          saveData('Activitate adăugată');
          render();
          requestAnimationFrame(() => {
            const input = grid.querySelector(`[data-key="${key}"][data-field="subject"]`);
            if(input){input.focus();input.select();}
          });
        });
      });

      grid.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.delete;
          delete data.classes[key];
          if(expandedKey === key) expandedKey = null;
          saveData('Activitate ștearsă');
          render();
        });
      });
    }

    function updateField(e){
      const key = e.target.dataset.key;
      const field = e.target.dataset.field;
      if(!data.classes[key]) return;
      data.classes[key][field] = e.target.value;
      saveData('Modificare salvată');
      if((field === 'type' || field === 'week') && e.type === 'change') render();
    }

    editToggle.addEventListener('click', () => {
      editing = !editing;
      expandedKey = null;
      document.body.classList.toggle('editing', editing);
      editToggle.setAttribute('aria-pressed', String(editing));
      editToggle.setAttribute('aria-label', editing ? 'Oprește modul de editare' : 'Activează modul de editare');
      render();
      showToast(editing ? 'Mod editare activ' : 'Mod vizualizare activ');
    });

    mobileTabs.addEventListener('click', e => {
      const btn = e.target.closest('[data-day]');
      if(!btn) return;
      selectedDay = Number(btn.dataset.day);
      storageSet('c11_1_selected_day', selectedDay);
      renderTabs();
    });



    render();

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

  })();
  </script>
</body>
</html>
