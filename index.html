<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080b12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Orar interactiv" />
  <meta name="apple-mobile-web-app-title" content="Orar" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>Orar</title>
  <style>
    :root{
      --bg:#05070c;
      --panel:rgba(8,12,20,.96);
      --panel-2:rgba(12,17,28,.94);
      --line:rgba(255,255,255,.07);
      --line-hot:rgba(226,18,59,.34);
      --accent:#d9133b;
      --accent-2:#ff315d;
      --text:#f7f7fb;
      --muted:#a7afc0;
      --muted-2:#6f7788;
      --shadow:0 18px 55px rgba(0,0,0,.34);
      --radius:10px;
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100vh;
      min-height:100svh;
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",system-ui,sans-serif;
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
      overflow:hidden;
      background:var(--bg);
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
      background-image:none;
      background-color:var(--bg);

      background-repeat:no-repeat;
      background-position:center center;
      background-size:contain;
      opacity:1;
    }
    body::after{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
      background:
        radial-gradient(circle at 50% 14%, rgba(255,255,255,.08), transparent 24%),
        linear-gradient(rgba(2,5,11,.42), rgba(2,5,11,.58)),
        linear-gradient(90deg, rgba(0,0,0,.22), rgba(0,0,0,0) 18%, rgba(0,0,0,0) 82%, rgba(0,0,0,.22));
    }

    /* Real top surface for iOS 26/27 chrome sampling + a soft fade over the safe area. */
    .ios-top-fade{
      position:fixed;
      inset:0 0 auto 0;
      height:calc(env(safe-area-inset-top) + 72px);
      pointer-events:none;
      z-index:2;
      background-color:rgba(5,7,12,.72);
      background-image:linear-gradient(180deg,rgba(5,7,12,.42) 0%,rgba(5,7,12,.22) 52%,rgba(5,7,12,0) 100%);
      -webkit-backdrop-filter:blur(18px) saturate(120%);
      backdrop-filter:blur(18px) saturate(120%);
      -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 56%,transparent 100%);
      mask-image:linear-gradient(to bottom,#000 0%,#000 56%,transparent 100%);
    }

    button,input,textarea,select{font:inherit}
    button{color:inherit}
    .app{position:relative;z-index:1;height:100vh;height:100svh;overflow-y:auto;overflow-x:hidden;padding:38px 5.8vw 56px;-webkit-overflow-scrolling:touch}

    .topbar{
      position:relative;
      min-height:132px;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      text-align:center;
    }
    .title-wrap{
      padding:8px 96px 0;
      text-shadow:0 2px 16px rgba(0,0,0,.7);
    }
    h1{margin:0;font-size:clamp(31px,3vw,48px);letter-spacing:.015em;line-height:1;font-weight:900}
    .subtitle{margin-top:12px;font-size:clamp(14px,1.4vw,19px);letter-spacing:.03em;color:#edf0f6}
    .cloud-sync-button{
      margin-top:12px;padding:7px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.16);
      background:rgba(7,10,17,.82);color:#f2f4f8;font-size:11px;font-weight:800;letter-spacing:.035em;
      box-shadow:0 8px 20px rgba(0,0,0,.24);cursor:pointer;transition:.18s ease;
    }
    .cloud-sync-button:hover:not(:disabled){transform:translateY(-1px);border-color:rgba(255,255,255,.3)}
    .cloud-sync-button:disabled{opacity:.55;cursor:default}
    body[data-orar-theme="ice"] .cloud-sync-button{background:rgba(255,255,255,.94);color:#111827;border-color:#0f234126}
    .save-state{display:none}

    .footer-mark{display:flex;justify-content:center;align-items:center;margin-top:18px;margin-bottom:4px;user-select:none;pointer-events:none}
    .footer-mark img{display:block;width:min(420px,70vw);height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}

    .edit-toggle{
      position:fixed;
      top:max(18px,env(safe-area-inset-top));
      right:max(18px,env(safe-area-inset-right));
      z-index:50;
      width:54px;height:54px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(7,10,17,.86);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      display:grid;place-items:center;
      box-shadow:0 12px 30px rgba(0,0,0,.34),inset 0 0 0 1px rgba(255,255,255,.025);
      cursor:pointer;
      transition:.2s ease;
    }
    .edit-toggle:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.32)}
    .edit-toggle[aria-pressed="true"]{
      background:linear-gradient(145deg,#a9092b,#ef1648);
      border-color:rgba(255,255,255,.35);
      box-shadow:0 0 0 5px rgba(217,19,59,.13),0 10px 35px rgba(217,19,59,.34);
    }
    .edit-toggle svg{width:23px;height:23px}
    .edit-toggle .save-icon{display:none}
    .edit-toggle[aria-pressed="true"] .edit-icon{display:none}
    .edit-toggle[aria-pressed="true"] .save-icon{display:block}
    .undo-toggle{
      position:fixed;
      top:max(18px,env(safe-area-inset-top));
      left:calc(max(18px,env(safe-area-inset-left)) + 66px);
      z-index:10000;
      width:54px;height:54px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(7,10,17,.9);
      color:#f8f0f3;
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      display:grid;place-items:center;
      box-shadow:0 12px 30px rgba(0,0,0,.34);
      cursor:pointer;
      transition:transform .2s ease,border-color .2s ease,opacity .2s ease;
    }
    .undo-toggle svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .undo-toggle:hover:not(:disabled){transform:translateY(-1px);border-color:rgba(255,255,255,.32)}
    .undo-toggle:disabled{opacity:.34;cursor:default}
    body[data-orar-theme="ice"] .undo-toggle{background:rgba(255,255,255,.94);color:#111827;border-color:#0f234126}
    .redo-toggle{left:calc(max(18px,env(safe-area-inset-left)) + 126px)}

    .mobile-tabs{display:none;gap:7px;overflow:auto;padding:0 1px 12px;scrollbar-width:none}
    .mobile-tabs::-webkit-scrollbar{display:none}
    .day-tab{
      flex:0 0 auto;
      transition:transform .16s ease,background .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease;
      padding:9px 15px;border-radius:999px;border:1px solid rgba(255,255,255,.12);
      background:rgba(8,12,20,.88);color:#d8dce5;font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
    }
    .day-tab.active{background:linear-gradient(90deg,#9d0a27,#c91137);border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(201,17,55,.18)}
    .day-tab:active{transform:scale(.94)}

    .schedule-shell{
      width:100%;
      max-width:1450px;
      margin:0 auto;
      border-radius:14px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(5px);
      -webkit-backdrop-filter:blur(5px);
    }
    .schedule-grid{
      display:grid;
      grid-template-columns:106px repeat(5,minmax(0,1fr));
      grid-auto-flow:row;
      gap:6px;
      align-items:stretch;
    }

    .head-cell,.time-cell,.slot-cell{
      min-width:0;
      border:1px solid var(--line);
      background:var(--panel);
      border-radius:var(--radius);
    }
    .head-cell{
      height:40px;
      display:flex;align-items:center;justify-content:center;
      text-transform:uppercase;
      font-size:12px;font-weight:800;letter-spacing:.025em;
      color:#f3eef1;
      background:linear-gradient(90deg,rgba(165,9,41,.98),rgba(188,14,48,.94));
      border-color:rgba(255,255,255,.07);
      box-shadow:inset 0 1px rgba(255,255,255,.04);
    }
    .head-cell.time-head{background:rgba(24,28,38,.97);color:#d8dbe2}

    .time-cell{
      min-height:86px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:4px;
      text-align:center;
      font-size:17px;
      color:#eef0f5;
      letter-spacing:.015em;
    }
    .time-sep{display:none}
    .time-edit{display:flex;flex-direction:column;gap:6px;width:100%;max-width:100%;min-width:0;padding:0 5px}
    .time-edit input{
      width:100%;
      min-width:0;
      border:1px solid rgba(255,255,255,.13);
      border-radius:7px;
      background:rgba(255,255,255,.045);
      color:#fff;
      padding:6px 5px;
      text-align:center;
      font-size:12px;
      outline:none;
    }
    .time-edit input:focus{border-color:rgba(255,49,93,.7);box-shadow:0 0 0 3px rgba(217,19,59,.12)}

    .slot-cell{
      min-height:82px;
      position:relative;
      overflow:hidden;
      background:rgba(8,12,20,.94);
      transition:min-height .2s ease,border-color .2s ease,background .2s ease;
    }
    .slot-cell.empty{
      display:flex;align-items:center;justify-content:center;
      color:#8790a2;
      font-size:18px;
      background:rgba(7,11,18,.88);
    }
    .slot-cell.empty::before{content:"—";opacity:.62}
    .note-open-slot{overflow:hidden;z-index:6}
    body.editing .slot-cell.empty::before{display:none}

    .add-class{
      width:calc(100% - 18px);height:calc(100% - 18px);min-height:66px;
      margin:9px;
      border:1px dashed rgba(255,255,255,.18);
      border-radius:9px;
      background:rgba(255,255,255,.025);
      color:#c0c6d2;
      cursor:pointer;
      font-weight:700;
    }
    .add-class:hover{border-color:rgba(255,49,93,.58);color:#fff;background:rgba(217,19,59,.07)}

    .class-card{
      position:relative;
      min-height:80px;
      height:auto;
      padding:10px 12px 9px 14px;
      border-left:3px solid var(--accent);
      background:linear-gradient(90deg,rgba(9,14,24,.99),rgba(9,13,22,.96));
      cursor:pointer;
      user-select:none;
      transition:background .2s ease,transform .2s ease;
    }
    .class-card:hover{background:linear-gradient(90deg,rgba(13,19,31,.99),rgba(10,15,25,.97))}
    .slot-cell:has(.class-card[aria-expanded="true"]){
      overflow:hidden;
      z-index:6;
    }
    .class-card[aria-expanded="true"]{
      height:auto;
      min-height:80px;
      overflow:visible;
      z-index:7;
    }
    body.editing .class-card{cursor:default;user-select:auto;padding-right:38px}

    .type-row{
      display:flex;align-items:center;gap:6px;
      min-height:18px;
      color:#f55677;
      font-size:10px;
      font-weight:900;
      letter-spacing:.04em;
      text-transform:uppercase;
      white-space:nowrap;
    }
    .type-icon{display:inline-grid;place-items:center;width:14px;height:14px;flex:0 0 auto}
    .type-icon svg{width:14px;height:14px;stroke:currentColor}
    .pair-tag{color:#ff6d89}
    .pair-dot{opacity:.7}
    .week-tag{color:#ff6d89}


    .week-edit{display:grid;grid-template-columns:14px 1fr;align-items:center;gap:5px}
    .week-mark{width:12px;height:12px;display:grid;place-items:center;color:#ef4269;font-size:12px;font-weight:900}

    .subject{
      margin-top:2px;
      font-weight:850;
      font-size:14px;
      line-height:1.14;
      letter-spacing:.002em;
      color:#fafbff;
      overflow-wrap:anywhere;
    }
    .meta-stack{margin-top:9px;display:grid;gap:2px}
    .meta-line{display:flex;align-items:center;gap:5px;color:#b4bbca;font-size:10px;min-width:0;line-height:1.15}
    .meta-icon{width:12px;height:12px;color:#ef4269;flex:0 0 auto;display:grid;place-items:center}
    .meta-icon svg{width:12px;height:12px;stroke:currentColor}
    .meta-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    .note-dot{
      position:absolute;top:10px;right:10px;
      width:9px;height:9px;border-radius:50%;
      background:#fff;
      box-shadow:0 0 7px #fff,0 0 16px rgba(255,255,255,.92),0 0 28px rgba(255,255,255,.48);
      opacity:0;
      transform:scale(.45);
      transition:.2s ease;
      pointer-events:none;
    }
    .has-note .note-dot{opacity:1;transform:scale(1)}
    .has-note.note-due-today .note-dot{
      background:#ff9b38;
      box-shadow:0 0 7px #ff9b38,0 0 16px rgba(255,155,56,.92),0 0 28px rgba(255,155,56,.48);
    }
    .has-note.note-overdue .note-dot{
      background:#ff304f;
      box-shadow:0 0 7px #ff304f,0 0 16px rgba(255,48,79,.92),0 0 28px rgba(255,48,79,.48);
    }
    body.editing .note-dot{right:35px}

    .note-panel{
      position:relative;
      z-index:8;
      pointer-events:auto;
      margin-top:11px;
      padding-top:10px;
      border-top:1px solid rgba(255,255,255,.09);
      cursor:default;
      contain:layout paint;
    }
    .note-panel{will-change:opacity,transform}
    .note-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
    .note-label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:900;color:#dce0e9}
    .deadline-wrap{
      margin-left:auto;
      display:flex;
      align-items:center;
      min-width:0;
      width:min(118px,46%);
    }
    .deadline-label{display:none}
    .deadline-input{
      width:100%;
      min-width:0;
      max-width:100%;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      color:#f3f4f8;
      border-radius:7px;
      padding:5px 7px;
      font-size:10px;
      outline:none;
      color-scheme:dark;
    }
    .deadline-input:focus{border-color:rgba(255,255,255,.3);box-shadow:0 0 0 3px rgba(255,255,255,.04)}
    .note-area{
      width:100%;min-height:84px;resize:vertical;
      pointer-events:auto;
      border:1px solid rgba(255,255,255,.11);
      background:rgba(0,0,0,.22);
      color:#fff;
      border-radius:8px;
      padding:9px 10px;
      outline:none;
      line-height:1.35;
      font-size:12px;
      user-select:text;
    }
    .note-area:focus,.note-area:focus-visible{outline:none;border-color:rgba(255,255,255,.11);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 72%,transparent),0 0 22px color-mix(in srgb,var(--accent) 38%,transparent),0 0 34px color-mix(in srgb,var(--accent) 18%,transparent)}
    .note-area::placeholder{color:#747d8e}

    .edit-fields{display:grid;gap:6px;margin-top:4px}
    .edit-input,.edit-select{
      width:100%;min-width:0;
      border:1px solid rgba(255,255,255,.13);
      background:rgba(255,255,255,.045);
      color:#fff;
      border-radius:7px;
      outline:none;
      padding:6px 8px;
      font-size:11px;
      line-height:1.15;
    }
    .edit-select{padding-right:26px;color:#ff7892;font-weight:900;text-transform:uppercase}
    .edit-input.subject-input{font-size:13px;font-weight:800;color:#fff}
    .edit-input:focus,.edit-select:focus{border-color:rgba(255,49,93,.72);box-shadow:0 0 0 3px rgba(217,19,59,.1)}
    .edit-meta{display:grid;grid-template-columns:14px 1fr;align-items:center;gap:5px}
    .delete-class{
      position:absolute;top:8px;right:8px;
      width:24px;height:24px;border-radius:50%;
      border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.25);
      color:#e7e9ef;cursor:pointer;display:grid;place-items:center;
      font-size:16px;line-height:1;
    }
    .delete-class:hover{background:#b30d31;border-color:#e13b60}

    .edit-banner{display:none!important}
    .reset-btn{
      border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:#fff;border-radius:7px;padding:6px 9px;cursor:pointer;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em
    }

    .toast{
      position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,18px);
      z-index:100;pointer-events:none;
      background:rgba(8,12,20,.94);border:1px solid rgba(255,255,255,.12);color:#fff;
      border-radius:999px;padding:9px 13px;font-size:11px;opacity:0;transition:.22s ease;box-shadow:0 10px 30px rgba(0,0,0,.3)
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}

    @media (min-width:901px){
      body::before{background-position:center center;background-size:cover;}
    }

    @media (max-width:900px) and (orientation:portrait), (hover:none) and (pointer:coarse) and (orientation:portrait){
      body::before{background-position:center 58%;background-size:cover;}
    }

    @media (max-width:900px) and (orientation:landscape), (hover:none) and (pointer:coarse) and (orientation:landscape){
      body::before{background-position:center 54%;background-size:cover;}
    }

    @media (max-width:1050px){
      .app{padding-left:3.5vw;padding-right:3.5vw}
      .schedule-grid{grid-template-columns:92px repeat(5,minmax(170px,1fr));overflow:visible}
      .schedule-shell{overflow-x:auto;padding-bottom:4px}
      .schedule-grid{min-width:1030px}
    }

    @media (max-width:900px), (hover:none) and (pointer:coarse){
      .app{height:100svh;padding:calc(12px + env(safe-area-inset-top)) 10px calc(28px + env(safe-area-inset-bottom));width:100%;overflow-y:auto;overflow-x:hidden}
      .topbar{min-height:184px;align-items:flex-start}
      .title-wrap{padding:56px 56px 0;max-width:100%}
      h1{font-size:32px}.subtitle{font-size:13px;margin-top:8px}.cloud-sync-button{margin-top:10px;padding:6px 12px;font-size:10px}.save-state{font-size:9px}
      .edit-toggle{width:48px;height:48px;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right))}
      .edit-toggle,.day-tab,.class-card,.add-class,.delete-class{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
      .edit-toggle{position:fixed;z-index:9999;pointer-events:auto}
      .undo-toggle{width:48px;height:48px;top:max(12px,env(safe-area-inset-top));left:calc(max(12px,env(safe-area-inset-left)) + 58px)}
      .redo-toggle{left:calc(max(12px,env(safe-area-inset-left)) + 106px)}
      .mobile-tabs{position:relative;z-index:20;pointer-events:auto}
      .schedule-shell,.schedule-grid,.slot-cell,.class-card{position:relative;z-index:2;pointer-events:auto}
      .mobile-tabs{display:flex;max-width:100%;margin:0 auto 4px;justify-content:flex-start}
      .schedule-shell{overflow:visible;width:100%;max-width:100%}
      .schedule-grid{min-width:0;grid-template-columns:82px minmax(0,1fr);gap:5px}
      .schedule-grid{width:100%;max-width:100%;overflow:hidden}
      .day-col{min-width:0!important;width:auto!important}
      .slot-cell,.head-cell,.class-card{max-width:100%;overflow:hidden}
      .subject,.meta-line{overflow-wrap:anywhere}
      .head-cell{height:36px;font-size:11px}
      .time-cell{min-height:88px;font-size:14px;overflow:hidden}
      .time-edit{width:calc(100% - 20px);max-width:calc(100% - 20px);padding:0;margin:0 auto;transform:none}
      .time-edit input{width:100%;max-width:100%;min-width:0;padding:6px 0;font-size:11px;-webkit-appearance:none;appearance:none}
      .slot-cell{min-height:88px}
      .class-card{min-height:86px;padding:9px 10px 8px 12px}
      .subject{font-size:14px}
      .meta-line{font-size:10px}
      

      body.mobile-day-0 .day-col:not(.day-0),
      body.mobile-day-1 .day-col:not(.day-1),
      body.mobile-day-2 .day-col:not(.day-2),
      body.mobile-day-3 .day-col:not(.day-3),
      body.mobile-day-4 .day-col:not(.day-4){display:none}
    }

    @media (max-width:900px) and (orientation:landscape), (max-width:960px) and (orientation:landscape) and (hover:none) and (pointer:coarse){
      .app{
        padding-top:calc(8px + env(safe-area-inset-top));
        padding-right:max(18px,env(safe-area-inset-right));
        padding-bottom:calc(16px + env(safe-area-inset-bottom));
        padding-left:max(18px,env(safe-area-inset-left));
        overflow-y:auto;
        overflow-x:hidden;
      }
      .topbar{min-height:66px}
      .title-wrap{padding:0 54px}
      h1{font-size:25px}
      .subtitle{font-size:10px;margin-top:5px}
      .mobile-tabs{display:none!important}
      .schedule-shell{
        width:calc(100% - 6px);
        max-width:none;
        margin-left:auto;
        margin-right:auto;
        overflow:visible!important;
        padding-bottom:0;
      }
      .schedule-grid{
        display:grid;
        width:100%;
        max-width:none;
        min-width:0!important;
        grid-template-columns:64px repeat(5,minmax(0,1fr))!important;
        gap:3px;
        overflow:visible!important;
      }
      body.mobile-day-0 .day-col,
      body.mobile-day-1 .day-col,

      .overlap-mini-subject{font-size:10px}
      .overlap-mini-meta{font-size:6.5px}
      .overlap-piece .overlap-mini-meta .meta-icon,
      .overlap-piece .overlap-mini-meta .meta-icon svg{width:8px;height:8px}
    }

    /* In combined view, every occupied card uses the same schedule-accent surface as overlap pieces. */
    .combined-class-card{
      --piece-accent:var(--card-custom,var(--accent));
      position:relative!important;
      border-left:0!important;
      background:
        radial-gradient(circle at 14% 14%,color-mix(in srgb,var(--piece-accent) 18%,transparent),transparent 46%),
        linear-gradient(145deg,color-mix(in srgb,var(--piece-accent) 8%,var(--panel,rgba(9,13,22,.98))),var(--panel,rgba(9,13,22,.94)) 74%)!important;
      box-shadow:none!important;
      overflow:hidden!important;
    }
    .combined-class-card::before{
      content:"";position:absolute;z-index:1;left:0;top:0;bottom:0;width:4px;
      background:var(--piece-accent);
      box-shadow:0 0 10px color-mix(in srgb,var(--piece-accent) 42%,transparent);
      pointer-events:none;
    }
    .combined-class-card > *{position:relative;z-index:2}
    .schedule-grid .combined-slot:has(> .combined-class-card:only-child){padding:0!important}
    .schedule-grid .combined-slot > .combined-class-card:only-child{
      width:100%!important;height:100%!important;min-height:var(--row-height)!important;border-radius:inherit!important;
    }

  </style>

  <script src="./classroom-config.js"></script>
  <script src="./classroom-view.js"></script>
  <script src="./student-planner.js"></script>
  <script src="./gemini-view.js"></script>
  <script src="./student-hub.js"></script>
  <script>
  (() => {
    'use strict';

    const DAYS = ['LUNI','MARȚI','MIERCURI','JOI','VINERI'];
    const STORAGE_KEY = 'c11_1_bleach_schedule_v3';
    const MULTI_STORAGE_KEY = 'c11_1_schedule_profiles_v1';
    const SCHEDULE_ACCENTS = ['red','blue','green','orange','violet','yellow'];

    const ICONS = {
      person: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"/><path d="M6.5 20c.5-4 2.3-6 5.5-6s5 2 5.5 6"/></svg>`,
      pin: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>`,
      course: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-5 9 5-9 5-9-5Z"/><path d="M7 12v5c3 2 7 2 10 0v-5"/><path d="M21 9v6"/></svg>`,
      seminar: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v18M12 8h4M12 12h4M12 16h3"/></svg>`,
      lab: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M8 15h8"/></svg>`
    };

    const initialData = {
      title:'Orar',
      subtitle:'',
      times: [
        ['08:00','09:30'],['09:40','11:10'],['11:20','12:50'],['13:00','14:30'],
        ['14:40','16:10'],['16:20','17:50'],['18:00','19:30'],['19:40','21:10']
      ],
      classes: {}
    };

    function storageGet(key){
      try{return localStorage.getItem(key);}catch(e){return null;}
    }

    function storageSet(key,value){
      try{localStorage.setItem(key,value);window.dispatchEvent(new CustomEvent('orar-local-change',{detail:{key}}));return true;}catch(e){return false;}
    }

    const legacyData = loadData();
    let scheduleBook = loadScheduleBook(legacyData);
    let activeScheduleId = scheduleBook.activeId;
    let data = activeScheduleEntry().schedule;
    normalizeScheduleData(data);
    let scheduleViewMode = scheduleBook.schedules.length > 1 && scheduleBook.view === 'combined' ? 'combined' : 'single';
    let selectedWeek = storageGet('c11_1_selected_week') === 'IMPARĂ' ? 'IMPARĂ' : 'PARĂ';
    let editing = false;
    let expandedKey = null;
    const iosStandaloneWebKit=Boolean(window.CSS&&CSS.supports&&CSS.supports('-webkit-touch-callout','none'));
    let selectedDay = Number(storageGet('c11_1_selected_day') || 0);
    if (!Number.isInteger(selectedDay) || selectedDay < 0 || selectedDay > 4) selectedDay = 0;

    const grid = document.getElementById('scheduleGrid');
    const scheduleTitle = document.getElementById('scheduleTitle');
    const scheduleSubtitle = document.getElementById('scheduleSubtitle');
    const cloudSyncButton = document.getElementById('cloudSyncButton');
    const editToggle = document.getElementById('editToggle');
    const saveState = document.getElementById('saveState');
    const mobileTabs = document.getElementById('mobileTabs');
    const scheduleViewBar = document.getElementById('scheduleViewBar');
    const scheduleManagerToggle = document.getElementById('scheduleManagerToggle');
    const scheduleManagerDialog = document.getElementById('scheduleManagerDialog');
    const toast = document.getElementById('toast');
    let toastTimer;
    let saveTimer;

    function clone(obj){ return JSON.parse(JSON.stringify(obj)); }
    function normalizeScheduleData(schedule){
      if(!schedule || !Array.isArray(schedule.times) || !schedule.classes || typeof schedule.classes!=='object')return clone(initialData);
      if(typeof schedule.title!=='string')schedule.title='Orar';
      if(typeof schedule.subtitle!=='string')schedule.subtitle='';
      Object.values(schedule.classes).forEach(item=>{
        for(const value of [item,item?.alternate]){
          if(!value)continue;
          if(!value.week)value.week=value.pair?'PARĂ':'MEREU';
          if(typeof value.deadline!=='string')value.deadline='';
          if(typeof value.note!=='string')value.note='';
          delete value.pair;delete value.noteKind;
        }
      });
      return schedule;
    }
    function activeScheduleEntry(){
      return scheduleBook?.schedules?.find(item=>item.id===activeScheduleId) || scheduleBook?.schedules?.[0];
    }
    function loadScheduleBook(legacy){
      try{
        const raw=storageGet(MULTI_STORAGE_KEY);
        if(raw){
          const parsed=JSON.parse(raw);
          if(parsed?.version===1&&Array.isArray(parsed.schedules)&&parsed.schedules.length){
            const seen=new Set();
            parsed.schedules=parsed.schedules.slice(0,6).map((entry,index)=>{
              let id=String(entry?.id||'schedule-'+(index+1));while(seen.has(id))id+='-'+index;seen.add(id);
              const schedule=normalizeScheduleData(entry?.schedule&&Array.isArray(entry.schedule.times)?entry.schedule:clone(initialData));
              const accent=SCHEDULE_ACCENTS.includes(entry?.accent)?entry.accent:SCHEDULE_ACCENTS[index%SCHEDULE_ACCENTS.length];
              return {id,name:String(entry?.name||schedule.title||('Orar '+(index+1))).trim().slice(0,60)||('Orar '+(index+1)),accent,schedule};
            });
            parsed.activeId=parsed.schedules.some(x=>x.id===parsed.activeId)?parsed.activeId:parsed.schedules[0].id;
            parsed.view=parsed.view==='combined'?'combined':'single';
            delete parsed.overlapColor;
            return parsed;
          }
        }
      }catch{}
      const schedule=normalizeScheduleData(clone(legacy||initialData));
      return {version:1,activeId:'primary',view:'single',schedules:[{id:'primary',name:String(schedule.title||'Orar 1').slice(0,60),accent:'red',schedule}]};
    }
    function syncActiveSchedule(){
      const entry=activeScheduleEntry();if(entry)entry.schedule=data;
      scheduleBook.activeId=activeScheduleId;
      scheduleBook.view=scheduleViewMode;
    }
    function persistScheduleBook(){
      syncActiveSchedule();
      storageSet(MULTI_STORAGE_KEY,JSON.stringify(scheduleBook));
      storageSet(STORAGE_KEY,JSON.stringify(data));
    }
    function clearScheduleHistory(){undoStack.length=0;redoStack.length=0;updateUndoButton();}
    function switchActiveSchedule(id,{renderNow=true}={}){
      const next=scheduleBook.schedules.find(item=>item.id===id);if(!next)return false;
      syncActiveSchedule();activeScheduleId=next.id;data=next.schedule;scheduleBook.activeId=next.id;
      scheduleViewMode='single';scheduleBook.view='single';expandedKey=null;clearScheduleHistory();persistScheduleBook();
      if(renderNow){render();animateSchedule();}
      return true;
    }
    function getScheduleTargets(){
      return scheduleBook.schedules.map(entry=>({id:entry.id,name:entry.name,accent:entry.accent,active:entry.id===activeScheduleId}));
    }
    function scheduleById(id){return scheduleBook.schedules.find(entry=>entry.id===id)?.schedule||null;}
    function applyScheduleToId(id,next){
      const entry=scheduleBook.schedules.find(item=>item.id===id);if(!entry)return false;
      if(entry.id===activeScheduleId)recordUndo();
      entry.schedule=normalizeScheduleData(clone(next));if(entry.id===activeScheduleId)data=entry.schedule;
      persistScheduleBook();if(entry.id===activeScheduleId)render();updateUndoButton();return true;
    }
    function addBlankSchedule(){
      if(scheduleBook.schedules.length>=6){showToast('Poți avea maximum 6 orare.');return null;}
      syncActiveSchedule();
      const number=scheduleBook.schedules.length+1,name='Orar '+number,id='schedule-'+Date.now().toString(36);
      const entry={id,name,accent:SCHEDULE_ACCENTS[(number-1)%SCHEDULE_ACCENTS.length],schedule:{title:name,subtitle:'',times:clone(data.times),classes:{}}};
      scheduleBook.schedules.push(entry);activeScheduleId=id;data=entry.schedule;scheduleBook.activeId=id;scheduleViewMode='single';scheduleBook.view='single';
      clearScheduleHistory();persistScheduleBook();render();return entry;
    }

    const undoToggle = document.getElementById('undoToggle');
    const redoToggle = document.getElementById('redoToggle');
    const weekToggleButton = document.getElementById('weekToggle');
    const scheduleFloatingControls = document.createElement('div');
    scheduleFloatingControls.id = 'scheduleFloatingControls';
    scheduleFloatingControls.className = 'schedule-floating-controls';
    document.querySelector('.app')?.before(scheduleFloatingControls);
    [undoToggle,redoToggle,editToggle,weekToggleButton,scheduleManagerToggle].forEach(button=>{
      if(button)scheduleFloatingControls.append(button);
    });
    const undoStack = [], redoStack = [];
    const historySnapshot=()=>({data:clone(data),activeScheduleId,selectedWeek,selectedDay});
    const historyEntry=()=>{const snapshot=historySnapshot();return {snapshot,signature:JSON.stringify(snapshot)};};
    function updateUndoButton(){
      undoToggle.disabled = undoStack.length === 0;
      redoToggle.disabled = redoStack.length === 0;
      undoToggle.setAttribute('aria-label', undoStack.length ? 'Anulează ultima modificare' : 'Nu există modificări de anulat');
      redoToggle.setAttribute('aria-label', redoStack.length ? 'Refă ultima modificare anulată' : 'Nu există modificări de refăcut');
    }
    function recordUndo(){
      const entry=historyEntry();
      if(undoStack.length && undoStack[undoStack.length-1].signature===entry.signature)return;
      undoStack.push(entry);
      if(undoStack.length>30)undoStack.shift();
      redoStack.length=0;
      updateUndoButton();
    }
    function applyHistory(entry,message){
      const profile=scheduleBook.schedules.find(item=>item.id===entry.snapshot.activeScheduleId);
      if(!profile)return;
      activeScheduleId=profile.id;profile.schedule=clone(entry.snapshot.data);data=profile.schedule;
      scheduleBook.activeId=activeScheduleId;scheduleViewMode='single';scheduleBook.view='single';
      selectedWeek=entry.snapshot.selectedWeek;selectedDay=entry.snapshot.selectedDay;expandedKey=null;
      storageSet('c11_1_selected_week',selectedWeek);
      storageSet('c11_1_selected_day',selectedDay);
      saveData(message);render();updateUndoButton();
    }
    function undoLastChange(){
      const entry=undoStack.pop();
      if(!entry)return;
      redoStack.push(historyEntry());
      if(redoStack.length>30)redoStack.shift();
      applyHistory(entry,'Modificare anulată');
      showToast('Ultima modificare a fost anulată');
    }
    function redoLastChange(){
      const entry=redoStack.pop();
      if(!entry)return;
      undoStack.push(historyEntry());
      if(undoStack.length>30)undoStack.shift();
      applyHistory(entry,'Modificare refăcută');
      showToast('Modificarea a fost refăcută');
    }

    function loadData(){
      try{
        const raw = storageGet(STORAGE_KEY);
        if(!raw) return clone(initialData);
        const parsed = JSON.parse(raw);
        if(!parsed || !Array.isArray(parsed.times) || typeof parsed.classes !== 'object') return clone(initialData);
        if(typeof parsed.title !== 'string') parsed.title=initialData.title;
        if(typeof parsed.subtitle !== 'string') parsed.subtitle=initialData.subtitle;
        Object.values(parsed.classes).forEach(item => {
          if(!item) return;
          if(!item.week) item.week = item.pair ? 'PARĂ' : 'MEREU';
          if(typeof item.deadline !== 'string') item.deadline = '';
          delete item.pair;
          delete item.noteKind;
        });
        return parsed;
      }catch(e){
        return clone(initialData);
      }
    }

    function saveData(message='Salvat'){
      persistScheduleBook();
      if(saveState){
        saveState.textContent = '';
      }
      clearTimeout(saveTimer);
    }

    function showToast(message){
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1700);
    }

    function escapeHtml(value=''){
      return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    }

    function typeIcon(type){
      if(type === 'LABORATOR') return ICONS.lab;
      if(type === 'SEMINAR') return ICONS.seminar;
      return ICONS.course;
    }

    const CARD_TONES=['default','red','green','blue','yellow','orange','violet'];
    const CARD_TONE_LABELS={default:'Default',red:'ROȘU',green:'VERDE',blue:'ALBASTRU',yellow:'GALBEN',orange:'PORTOCALIU',violet:'VIOLET'};
    function cardTone(item){
      const value=String(item?.cardColor||'default').toLowerCase();
      return CARD_TONES.includes(value)?value:'default';
    }

    function todayISO(){
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    }

    function noteState(item){
      if(!item || !(item.note || '').trim()) return '';
      const deadline = (item.deadline || '').trim();
      if(!deadline) return 'has-note';
      const today = todayISO();
      if(deadline < today) return 'has-note note-overdue';
      if(deadline === today) return 'has-note note-due-today';
      return 'has-note';
    }

    function noteDotTitle(item){
      if(!item || !(item.note || '').trim()) return '';
      const deadline = (item.deadline || '').trim();
      if(!deadline) return 'Ai ceva de făcut';
      const today = todayISO();
      if(deadline < today) return `Termen depășit: ${deadline}`;
      if(deadline === today) return `Termen astăzi: ${deadline}`;
      return `Termen: ${deadline}`;
    }

    function renderScheduleViewBar(){
      const multi=scheduleBook.schedules.length>1;
      scheduleViewBar.hidden=!multi||editing;
      if(!multi){scheduleViewBar.innerHTML='';return;}
      const combinedName=scheduleBook.schedules.map(entry=>escapeHtml(entry.name)).join(' • ');
      scheduleViewBar.innerHTML=`<button type="button" data-schedule-view="combined" aria-pressed="${scheduleViewMode==='combined'}">${combinedName}</button>`+
        scheduleBook.schedules.map(entry=>`<button type="button" data-schedule-id="${escapeHtml(entry.id)}" aria-pressed="${scheduleViewMode==='single'&&entry.id===activeScheduleId}">${escapeHtml(entry.name)}</button>`).join('');
    }
    function activeItemFrom(schedule,key){
      const item=schedule?.classes?.[key];if(!item)return null;
      if(item.week==='MEREU'||item.week===selectedWeek)return item;
      return item.alternate&&item.alternate.week===selectedWeek?item.alternate:null;
    }
    const timeMinutes=value=>{const [h,m]=String(value||'00:00').split(':').map(Number);return (h||0)*60+(m||0);};
    function combinedTimes(){
      const intervals=[];
      scheduleBook.schedules.forEach(entry=>(entry.schedule.times||[]).forEach((pair,row)=>{
        if(!Array.isArray(pair)||!/^\d{2}:\d{2}$/.test(pair[0]||'')||!/^\d{2}:\d{2}$/.test(pair[1]||''))return;
        const start=timeMinutes(pair[0]),end=timeMinutes(pair[1]);if(end<=start)return;
        intervals.push({start,end,startText:String(pair[0]),endText:String(pair[1]),entryId:entry.id,row});
      }));
      intervals.sort((a,b)=>a.start-b.start||a.end-b.end);
      const bands=[];
      for(const interval of intervals){
        const last=bands[bands.length-1];
        if(last&&interval.start<last.end){
          last.end=Math.max(last.end,interval.end);last.endText=last.end===interval.end?interval.endText:last.endText;last.members.push(interval);
        }else bands.push({start:interval.start,end:interval.end,startText:interval.startText,endText:interval.endText,members:[interval]});
      }
      return bands.map(band=>[band.startText,band.endText,band]);
    }
    function combinedItemsAt(time,day){
      const band=time[2],out=[];if(!band)return out;
      for(const member of band.members){
        const entry=scheduleBook.schedules.find(item=>item.id===member.entryId);if(!entry)continue;
        const key=member.row+'-'+day,item=activeItemFrom(entry.schedule,key);
        if(item)out.push({entry,item,key});
      }
      return out;
    }
    function renderCombinedCard(record){
      const {entry,item}=record,tone=SCHEDULE_ACCENTS.includes(entry.accent)?entry.accent:'red';
      return `<article class="class-card combined-class-card card-tone-${tone}">
        <span class="schedule-source">${escapeHtml(entry.name)}</span>
        <div class="type-row"><span class="type-icon">${typeIcon(item.type)}</span><span>${escapeHtml(item.type)}</span>${item.week!=='MEREU'?'<span class="pair-dot">•</span><span class="week-tag">'+escapeHtml(item.week)+'</span>':''}</div>
        <div class="subject">${escapeHtml(item.subject)}</div>
        <div class="meta-stack"><div class="meta-line"><span class="meta-icon">${ICONS.person}</span><span class="meta-text">${escapeHtml(item.professor)}</span></div><div class="meta-line"><span class="meta-icon">${ICONS.pin}</span><span class="meta-text">${escapeHtml(item.location)}</span></div></div>
      </article>`;
    }
    function scheduleAccentTone(record){
      const tone=String(record?.entry?.accent||'red').toLowerCase();
      return SCHEDULE_ACCENTS.includes(tone)?tone:'red';
    }
    function renderOverlapPiece(record,position){
      const {entry,item}=record,tone=scheduleAccentTone(record);
      const parity=item.week!=='MEREU'?' · '+item.week:'';
      return `<section class="overlap-piece ${position==='top'?'is-top':'is-bottom'} schedule-accent-${tone}" aria-label="${escapeHtml(entry.name+': '+item.subject)}">
        <div class="overlap-piece-inner">
          <div class="overlap-mini-head"><span class="overlap-mini-source">${escapeHtml(entry.name)}</span><span class="overlap-mini-type">${escapeHtml(item.type+parity)}</span></div>
          <div class="overlap-mini-subject">${escapeHtml(item.subject)}</div>
          <div class="overlap-mini-meta"><span class="meta-icon">${ICONS.person}</span><span class="overlap-mini-text">${escapeHtml(item.professor)}</span></div>
          <div class="overlap-mini-meta"><span class="meta-icon">${ICONS.pin}</span><span class="overlap-mini-text">${escapeHtml(item.location)}</span></div>
        </div>
      </section>`;
    }
    function renderCombinedSlot(time,day,bandIndex){
      const items=combinedItemsAt(time,day);
      const attrs=` data-combined-band="${bandIndex}" data-combined-day="${day}"`;
      if(!items.length)return `<div class="slot-cell empty day-col day-${day}"${attrs}></div>`;
      if(items.length===2&&isCompactOverlapView()){
        return `<div class="slot-cell combined-slot overlap-split day-col day-${day}"${attrs}>${renderOverlapPiece(items[0],'top')}${renderOverlapPiece(items[1],'bottom')}</div>`;
      }
      return `<div class="slot-cell combined-slot day-col day-${day}"${attrs}>${items.map(renderCombinedCard).join('')}</div>`;
    }
    function renderTabs(){
      let buttons=[...mobileTabs.querySelectorAll('.day-tab')];
      if(buttons.length!==DAYS.length){
        mobileTabs.replaceChildren(...DAYS.map((day,i)=>{
          const button=document.createElement('button');
          button.className='day-tab';button.type='button';button.textContent=day;button.dataset.day=String(i);
          return button;
        }));
        buttons=[...mobileTabs.querySelectorAll('.day-tab')];
      }
      buttons.forEach((button,i)=>{
        button.dataset.day=String(i);
        if(button.textContent!==DAYS[i])button.textContent=DAYS[i];
        button.classList.toggle('active',i===selectedDay);
        button.setAttribute('aria-pressed',String(i===selectedDay));
      });
      document.body.classList.remove('mobile-day-0','mobile-day-1','mobile-day-2','mobile-day-3','mobile-day-4');
      document.body.classList.add(`mobile-day-${selectedDay}`);
    }

    function render(){
      const combined=scheduleBook.schedules.length>1&&scheduleViewMode==='combined'&&!editing;
      if(document.activeElement!==scheduleTitle)scheduleTitle.textContent=combined?'Orar combinat':data.title;
      if(document.activeElement!==scheduleSubtitle)scheduleSubtitle.textContent=combined?scheduleBook.schedules.map(entry=>entry.name).join(' • '):data.subtitle;
      renderTabs();renderScheduleViewBar();
      document.body.dataset.week=selectedWeek;
      document.getElementById('weekLabel').textContent=selectedWeek;
      document.getElementById('weekToggle').setAttribute('aria-label', `Săptămâna ${selectedWeek}. Afișează săptămâna ${oppositeWeek(selectedWeek)}`);
      let html=`<div class="head-cell time-head">ORA</div>`;
      DAYS.forEach((day,i)=>html+=`<div class="head-cell day-col day-${i}">${day}</div>`);
      if(combined){
        combinedTimes().forEach((time,row)=>{
          html+=renderTimeCell(time,row);
          DAYS.forEach((_,day)=>{html+=renderCombinedSlot(time,day,row);});
        });
      }else{
        data.times.forEach((time,row)=>{
          html+=renderTimeCell(time,row);
          DAYS.forEach((_,day)=>{const key=`${row}-${day}`,item=activeItem(key);html+=renderSlot(item,key,day);});
        });
      }
      grid.innerHTML=html;
      if(!combined)attachDynamicHandlers();
    }

    function renderTimeCell(time,row){
      if(editing){
        return `<div class="time-cell">
          <div class="time-edit">
            <input type="time" value="${escapeHtml(time[0])}" data-time-row="${row}" data-time-part="0" aria-label="Ora de început">
            <input type="time" value="${escapeHtml(time[1])}" data-time-row="${row}" data-time-part="1" aria-label="Ora de sfârșit">
          </div>
        </div>`;
      }
      return `<div class="time-cell"><div>${escapeHtml(time[0])}</div><div>${escapeHtml(time[1])}</div></div>`;
    }

    function renderSlot(item,key,day){
      if(!item){
        return `<div class="slot-cell empty day-col day-${day}" data-key="${key}">
          ${editing ? `<button class="add-class" type="button" data-add="${key}">＋ Adaugă${data.classes[key] ? ' · '+selectedWeek : ''}</button>` : ''}
        </div>`;
      }
      return `<div class="slot-cell day-col day-${day} ${(!editing && expandedKey === key) ? 'note-open-slot' : ''}" data-key="${key}">${renderCard(item,key)}</div>`;
    }

    function oppositeWeek(week){return week === 'PARĂ' ? 'IMPARĂ' : 'PARĂ';}

    function activeItem(key){return activeItemFrom(data,key);}

    let gridMotion;
    function animateSchedule(direction=0){
      if(!grid.animate || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
      if(gridMotion) gridMotion.cancel();
      if(iosStandaloneWebKit){
        gridMotion=grid.animate([{opacity:.45},{opacity:1}],{duration:190,easing:'ease-out'});
        return;
      }
      const from = direction === 1 ? 'translateX(24px)' : direction === -1 ? 'translateX(-24px)' : 'translateY(4px)';
      gridMotion = grid.animate([
        {opacity:.35,transform:from},
        {opacity:1,transform:'translate(0,0)'}
      ],{duration:210,easing:'cubic-bezier(.2,.8,.2,1)'});
    }

    let dayTransitionId = 0;

    function makeDayTransitionVisual(dayIndex){
      const clone=grid.cloneNode(true);
      clone.removeAttribute('id');
      clone.querySelectorAll('[id]').forEach(node=>node.removeAttribute('id'));
      clone.querySelectorAll('.day-col').forEach(node=>{
        const visible=node.classList.contains('day-'+dayIndex);
        if(!visible)node.style.setProperty('display','none','important');
        else if(node.classList.contains('head-cell'))node.style.setProperty('display','flex','important');
        else if(node.classList.contains('slot-cell'))node.style.setProperty('display','flex','important');
        else node.style.setProperty('display','block','important');
      });
      clone.querySelectorAll('input,select,textarea,button,[tabindex]').forEach(node=>node.setAttribute('tabindex','-1'));
      const layer=document.createElement('div');
      layer.className='schedule-day-motion-layer';
      layer.setAttribute('aria-hidden','true');
      layer.append(clone);
      return layer;
    }

    async function animateIosDaySwap(nextDay,forward,transitionId){
      const shell=grid.parentElement;
      const oldLayer=makeDayTransitionVisual(selectedDay);
      shell.append(oldLayer);

      selectedDay=nextDay;
      expandedKey=null;
      storageSet('c11_1_selected_day',selectedDay);
      render();

      if(transitionId!==dayTransitionId){oldLayer.remove();return;}
      const newLayer=makeDayTransitionVisual(selectedDay);
      shell.append(newLayer);
      shell.classList.add('is-day-transitioning');
      grid.style.visibility='hidden';

      const distance='104%';
      const oldEnd=forward?'-'+distance:distance;
      const newStart=forward?distance:'-'+distance;
      const oldAnimation=oldLayer.animate(
        [{transform:'translate3d(0,0,0)',opacity:1},{transform:`translate3d(${oldEnd},0,0)`,opacity:.18}],
        {duration:280,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}
      );
      const newAnimation=newLayer.animate(
        [{transform:`translate3d(${newStart},0,0)`,opacity:.35},{transform:'translate3d(0,0,0)',opacity:1}],
        {duration:330,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'}
      );

      let cleaned=false;
      const cleanup=()=>{
        if(cleaned)return;cleaned=true;
        try{oldAnimation.cancel();newAnimation.cancel();}catch{}
        oldLayer.remove();newLayer.remove();
        shell.classList.remove('is-day-transitioning');
        grid.style.removeProperty('visibility');
        void grid.offsetHeight;
      };
      const motion={cancel:cleanup};
      gridMotion=motion;
      try{await Promise.all([oldAnimation.finished,newAnimation.finished]);}catch{}
      if(gridMotion===motion)gridMotion=null;
      cleanup();
    }

    async function changeDay(nextDay){
      if(nextDay === selectedDay) return;

      const transitionId = ++dayTransitionId;
      const forward = nextDay > selectedDay;
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if(gridMotion){
        try{ gridMotion.cancel(); }catch(e){}
        gridMotion = null;
      }

      if(iosStandaloneWebKit&&!reduce&&window.matchMedia('(max-width:900px) and (orientation:portrait)').matches){
        await animateIosDaySwap(nextDay,forward,transitionId);
        return;
      }

      if(grid.animate && !reduce){
        const outX = forward ? '-105%' : '105%';
        const outgoing = grid.animate(
          iosStandaloneWebKit
            ? [{opacity:1},{opacity:.12}]
            : [{transform:'translateX(0)',opacity:1},{transform:`translateX(${outX})`,opacity:1}],
          {
            duration:iosStandaloneWebKit?120:180,
            easing:iosStandaloneWebKit?'ease-out':'cubic-bezier(.55,.05,.85,.35)',
            fill:'forwards'
          }
        );

        gridMotion = outgoing;

        try{ await outgoing.finished; }catch(e){}

        if(transitionId !== dayTransitionId) return;

        // Remove the fill:forwards transform before rendering the new day.
        try{ outgoing.cancel(); }catch(e){}
        if(gridMotion === outgoing) gridMotion = null;
      }

      if(transitionId !== dayTransitionId) return;

      selectedDay = nextDay;
      expandedKey = null;
      storageSet('c11_1_selected_day', selectedDay);
      render();

      if(grid.animate && !reduce){
        const inX = forward ? '105%' : '-105%';
        const incoming = grid.animate(
          iosStandaloneWebKit
            ? [{opacity:.12},{opacity:1}]
            : [{transform:`translateX(${inX})`,opacity:1},{transform:'translateX(0)',opacity:1}],
          {
            duration:iosStandaloneWebKit?170:230,
            easing:iosStandaloneWebKit?'ease-out':'cubic-bezier(.16,1,.3,1)'
          }
        );

        gridMotion = incoming;
        incoming.finished.then(() => {
          if(gridMotion === incoming) gridMotion = null;
        }).catch(() => {});
      }
    }

    let weekFadeMotions = [];

    function combinedParityAffectedSlots(){
      const bands=combinedTimes(),affected=new Map();
      scheduleBook.schedules.forEach(entry=>{
        Object.entries(entry.schedule?.classes||{}).forEach(([key,root])=>{
          if(!root)return;
          const rootParity=root.week&&root.week!=='MEREU';
          const altParity=root.alternate&&root.alternate.week&&root.alternate.week!=='MEREU';
          if(!rootParity&&!altParity)return;
          const parts=key.split('-'),sourceRow=Number(parts[0]),day=Number(parts[1]);
          if(!Number.isInteger(sourceRow)||day<0||day>4)return;
          const bandIndex=bands.findIndex(time=>time?.[2]?.members?.some(member=>member.entryId===entry.id&&member.row===sourceRow));
          if(bandIndex<0)return;
          affected.set(bandIndex+'-'+day,{bandIndex,day});
        });
      });
      return {bands,slots:[...affected.values()]};
    }

    function refreshCombinedParitySlot(bands,bandIndex,day){
      const slot=grid.querySelector(`[data-combined-band="${bandIndex}"][data-combined-day="${day}"]`);
      const time=bands[bandIndex];
      if(!slot||!time)return null;
      const holder=document.createElement('div');
      holder.innerHTML=renderCombinedSlot(time,day,bandIndex);
      const next=holder.firstElementChild;
      if(!next)return null;
      slot.className=next.className;
      slot.innerHTML=next.innerHTML;
      slot.querySelectorAll('.class-card,.overlap-piece').forEach(node=>node.style.setProperty('animation','none','important'));
      return slot;
    }

    function parityAffectedKeys(){
      return Object.keys(data.classes).filter(key => {
        const root = data.classes[key];
        if(!root) return false;
        const rootParity = root.week && root.week !== 'MEREU';
        const altParity = root.alternate && root.alternate.week && root.alternate.week !== 'MEREU';
        return Boolean(rootParity || altParity);
      });
    }

    function refreshParitySlot(key){
      const slot=grid.querySelector(`[data-key="${key}"]`);
      if(!slot)return null;
      const day=Number(String(key).split('-')[1]);
      const item=activeItem(key);
      slot.className=`slot-cell${item?'':' empty'} day-col day-${day}${item&&!editing&&expandedKey===key?' note-open-slot':''}`;
      if(item){
        slot.innerHTML=renderCard(item,key);
        const card=slot.querySelector('.class-card');
        if(card)card.style.setProperty('animation','none','important');
      }else{
        slot.innerHTML=editing?`<button class="add-class" type="button" data-add="${key}">＋ Adaugă${data.classes[key]?' · '+selectedWeek:''}</button>`:'';
      }
      attachDynamicHandlers(slot);
      return slot;
    }

    async function selectWeek(week){
      if(week === selectedWeek) return;

      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      weekFadeMotions.forEach(m => { try{ m.cancel(); }catch(e){} });
      weekFadeMotions = [];

      if(scheduleViewMode==='combined'&&scheduleBook.schedules.length>1&&!editing){
        const {bands,slots}=combinedParityAffectedSlots();
        const outgoing=[];
        if(!reduce){
          slots.forEach(({bandIndex,day})=>{
            const slot=grid.querySelector(`[data-combined-band="${bandIndex}"][data-combined-day="${day}"]`);
            if(!slot)return;
            slot.querySelectorAll('.class-card,.overlap-piece').forEach(node=>{
              if(!node.animate)return;
              outgoing.push(node.animate(
                [{opacity:1},{opacity:0}],
                {duration:170,easing:'ease-out',fill:'forwards'}
              ));
            });
          });
          weekFadeMotions=outgoing;
          if(outgoing.length)await Promise.allSettled(outgoing.map(m=>m.finished));
          outgoing.forEach(m=>{try{m.cancel();}catch{}});
        }

        selectedWeek=week;
        storageSet('c11_1_selected_week',week);
        document.body.dataset.week=selectedWeek;
        document.getElementById('weekLabel').textContent=selectedWeek;
        document.getElementById('weekToggle').setAttribute('aria-label',`Săptămâna ${selectedWeek}. Afișează săptămâna ${oppositeWeek(selectedWeek)}`);

        slots.forEach(({bandIndex,day})=>refreshCombinedParitySlot(bands,bandIndex,day));

        weekFadeMotions=[];
        if(!reduce){
          slots.forEach(({bandIndex,day})=>{
            const slot=grid.querySelector(`[data-combined-band="${bandIndex}"][data-combined-day="${day}"]`);
            if(!slot)return;
            slot.querySelectorAll('.class-card,.overlap-piece').forEach(node=>{
              if(!node.animate)return;
              weekFadeMotions.push(node.animate(
                [{opacity:0},{opacity:1}],
                {duration:210,easing:'ease-out'}
              ));
            });
          });
          Promise.allSettled(weekFadeMotions.map(m=>m.finished)).finally(()=>{weekFadeMotions=[];});
        }
        return;
      }

      const affectedKeys = parityAffectedKeys();
      if(!reduce){
        affectedKeys.forEach(key => {
          const card = grid.querySelector(`[data-key="${key}"] .class-card`);
          if(!card || !card.animate)return;
          weekFadeMotions.push(card.animate(
            [{opacity:1},{opacity:0}],
            {duration:180,easing:'ease-out',fill:'forwards'}
          ));
        });
        if(weekFadeMotions.length)await Promise.allSettled(weekFadeMotions.map(m=>m.finished));
      }

      selectedWeek=week;
      storageSet('c11_1_selected_week',week);
      if(expandedKey&&affectedKeys.includes(expandedKey))expandedKey=null;
      document.body.dataset.week=selectedWeek;
      document.getElementById('weekLabel').textContent=selectedWeek;
      document.getElementById('weekToggle').setAttribute('aria-label',`Săptămâna ${selectedWeek}. Afișează săptămâna ${oppositeWeek(selectedWeek)}`);

      affectedKeys.forEach(refreshParitySlot);

      weekFadeMotions=[];
      if(!reduce){
        affectedKeys.forEach(key=>{
          const card=grid.querySelector(`[data-key="${key}"] .class-card`);
          if(!card||!card.animate)return;
          weekFadeMotions.push(card.animate(
            [{opacity:0},{opacity:1}],
            {duration:220,easing:'ease-out'}
          ));
        });
        Promise.allSettled(weekFadeMotions.map(m=>m.finished)).finally(()=>{
          weekFadeMotions=[];
        });
      }
    }

    function isLandscapePhone(){
      return Boolean(window.matchMedia && window.matchMedia('(max-width:900px) and (orientation:landscape)').matches);
    }

    function isCompactOverlapView(){
      return Boolean(window.matchMedia && window.matchMedia('(max-width:960px)').matches);
    }

    let noteToggleMotionId = 0;

    async function collapseNoteSlot(key,motionId,reduce=false){
      const slot=grid.querySelector(`[data-key="${key}"]`);
      const panel=slot?.querySelector('.note-panel');
      if(!slot){
        if(expandedKey===key)expandedKey=null;
        return;
      }

      if(reduce){
        if(expandedKey===key)expandedKey=null;
        refreshParitySlot(key);
        return;
      }

      const startHeight=slot.getBoundingClientRect().height;
      const baseHeight=parseFloat(getComputedStyle(grid).getPropertyValue('--row-height'))||88;
      slot.style.overflow='hidden';
      slot.style.willChange='height';

      const motions=[];
      if(slot.animate)motions.push(slot.animate(
        [{height:`${startHeight}px`},{height:`${baseHeight}px`}],
        {duration:240,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'}
      ));
      if(panel?.animate)motions.push(panel.animate(
        [{opacity:1},{opacity:0}],
        {duration:180,easing:'ease-out',fill:'forwards'}
      ));

      if(motions.length)await Promise.allSettled(motions.map(animation=>animation.finished));
      if(motionId!==noteToggleMotionId)return;
      motions.forEach(animation=>{try{animation.cancel();}catch{}});
      if(expandedKey===key)expandedKey=null;
      refreshParitySlot(key);
    }

    async function expandNoteSlot(key,motionId,reduce=false){
      const oldSlot=grid.querySelector(`[data-key="${key}"]`);
      const baseHeight=oldSlot?.getBoundingClientRect().height||(parseFloat(getComputedStyle(grid).getPropertyValue('--row-height'))||88);

      expandedKey=key;
      refreshParitySlot(key);

      const slot=grid.querySelector(`[data-key="${key}"]`);
      const card=slot?.querySelector('.class-card');
      const panel=card?.querySelector('.note-panel');
      if(!slot||!card)return;

      if(reduce){
        requestAnimationFrame(()=>grid.querySelector(`[data-note="${key}"]`)?.focus({preventScroll:true}));
        return;
      }

      const targetHeight=Math.max(baseHeight,card.scrollHeight);
      slot.style.height=`${baseHeight}px`;
      slot.style.overflow='hidden';
      slot.style.willChange='height';
      if(panel)panel.style.opacity='0';

      await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
      if(motionId!==noteToggleMotionId)return;

      const motions=[];
      if(slot.animate)motions.push(slot.animate(
        [{height:`${baseHeight}px`},{height:`${targetHeight}px`}],
        {duration:280,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'}
      ));
      if(panel?.animate)motions.push(panel.animate(
        [{opacity:0},{opacity:1}],
        {duration:220,easing:'ease-out',fill:'forwards'}
      ));

      if(motions.length)await Promise.allSettled(motions.map(animation=>animation.finished));
      if(motionId!==noteToggleMotionId)return;
      motions.forEach(animation=>{try{animation.cancel();}catch{}});
      slot.style.removeProperty('height');
      slot.style.removeProperty('overflow');
      slot.style.removeProperty('will-change');
      if(panel)panel.style.removeProperty('opacity');
      requestAnimationFrame(()=>grid.querySelector(`[data-note="${key}"]`)?.focus({preventScroll:true}));
    }

    async function toggleNoteCard(key){
      const motionId=++noteToggleMotionId;
      const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const opening=expandedKey!==key;

      if(!opening){
        await collapseNoteSlot(key,motionId,reduce);
        return;
      }

      const previous=expandedKey;
      if(previous&&previous!==key){
        await collapseNoteSlot(previous,motionId,reduce);
        if(motionId!==noteToggleMotionId)return;
      }

      await expandNoteSlot(key,motionId,reduce);
    }
