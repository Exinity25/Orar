    function attachDynamicHandlers(scope=grid){
      scope.querySelectorAll('[data-card]').forEach(card => {
        if(editing) return;
        card.addEventListener('click', e => {
          if(e.target.closest('.note-panel, .week-switch')) return;
          const key = card.dataset.card;
          toggleNoteCard(key);
        });
        card.addEventListener('keydown', e => {
          if((e.key === 'Enter' || e.key === ' ') && !e.target.closest('.note-panel, .week-switch')){
            e.preventDefault();card.click();
          }
        });
      });

      scope.querySelectorAll('[data-note]').forEach(area => {
        area.addEventListener('click', e=>e.stopPropagation());
        area.addEventListener('focus',()=>{if(!area.dataset.undoCaptured){recordUndo();area.dataset.undoCaptured='1';}});
        area.addEventListener('input', e => {
          const key = e.target.dataset.note;
          const item = activeItem(key);
          item.note = e.target.value;
          saveData('Notiță salvată');
          const card = e.target.closest('.class-card');
          card.classList.remove('has-note','note-due-today','note-overdue');
          noteState(item).split(' ').filter(Boolean).forEach(cls => card.classList.add(cls));
          const dot = card.querySelector('.note-dot');
          if(dot) dot.title = noteDotTitle(item);
        });
      });

      scope.querySelectorAll('[data-deadline]').forEach(input => {
        input.addEventListener('click', e=>e.stopPropagation());
        input.addEventListener('change', e => {
          recordUndo();
          const key = e.target.dataset.deadline;
          const item = activeItem(key);
          item.deadline = e.target.value || '';
          saveData(item.deadline ? 'Termen salvat' : 'Termen eliminat');
          const card = e.target.closest('.class-card');
          card.classList.remove('has-note','note-due-today','note-overdue');
          noteState(item).split(' ').filter(Boolean).forEach(cls => card.classList.add(cls));
          const dot = card.querySelector('.note-dot');
          if(dot) dot.title = noteDotTitle(item);
        });
      });

      scope.querySelectorAll('[data-field]').forEach(control => {
        control.addEventListener('focus',()=>{if(!control.dataset.undoCaptured){recordUndo();control.dataset.undoCaptured='1';}});
        control.addEventListener('input', updateField);
        control.addEventListener('change', updateField);
      });

      scope.querySelectorAll('[data-time-row]').forEach(control => {
        control.addEventListener('focus',()=>{if(!control.dataset.undoCaptured){recordUndo();control.dataset.undoCaptured='1';}});
        control.addEventListener('input', e => {
          const row = Number(e.target.dataset.timeRow);
          const part = Number(e.target.dataset.timePart);
          data.times[row][part] = e.target.value;
          saveData('Ore salvate');
        });
      });

      scope.querySelectorAll('[data-add]').forEach(btn => {
        btn.addEventListener('click', () => {
          recordUndo();
          const key = btn.dataset.add;
          const existing = data.classes[key];
          const added = {type:'CURS',week:existing ? selectedWeek : 'MEREU',subject:'Materie nouă',professor:'Profesor',location:'Locație',note:'',deadline:'',cardColor:'default'};
          if(existing) existing.alternate = added;
          else data.classes[key] = added;
          saveData('Activitate adăugată');
          render();
          requestAnimationFrame(() => {
            const input = grid.querySelector(`[data-key="${key}"][data-field="subject"]`);
            if(input){input.focus();input.select();}
          });
        });
      });

      scope.querySelectorAll('.card-color-picker').forEach(picker => {
        picker.addEventListener('toggle',()=>{
          if(!picker.open)return;
          grid.querySelectorAll('.card-color-picker[open]').forEach(other=>{if(other!==picker)other.open=false;});
        });
      });
      scope.querySelectorAll('[data-card-color]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const key=btn.dataset.key,item=activeItem(key);if(!item)return;
          recordUndo();
          item.cardColor=btn.dataset.cardColor;
          saveData('Culoare salvată');
          render();
        });
      });

      scope.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', () => {
          recordUndo();
          const key = btn.dataset.delete;
          const root = data.classes[key];
          if(activeItem(key) === root.alternate) delete root.alternate;
          else if(root.alternate) data.classes[key] = root.alternate;
          else delete data.classes[key];
          if(expandedKey === key) expandedKey = null;
          saveData('Activitate ștearsă');
          render();
        });
      });
    }

    function updateField(e){
      const key = e.target.dataset.key;
      const field = e.target.dataset.field;
      const item = activeItem(key);
      if(!item) return;
      const root = data.classes[key];
      if(field === 'week' && root.alternate){
        if(e.target.value === 'MEREU'){e.target.value = item.week;return;}
        const other = item === root ? root.alternate : root;
        other.week = oppositeWeek(e.target.value);
      }
      item[field] = e.target.value;
      if(field === 'week' && item.week !== 'MEREU'){
        selectedWeek = item.week;
        storageSet('c11_1_selected_week',selectedWeek);
      }
      saveData('Modificare salvată');
      if((field === 'type' || field === 'week' || field === 'cardColor') && e.type === 'change') render();
    }

    function renderScheduleManager(){
      scheduleManagerDialog.innerHTML=`<div class="pl-dialog-head"><h2>Orare</h2><button type="button" data-schedule-manager-close aria-label="Închide">✕</button></div>
        <p>Fiecare orar poate avea propriul nume și accent. În modul combinat, activitățile păstrează accentul orarului din care provin.</p>
        <div class="schedule-manager-list">${scheduleBook.schedules.map(entry=>`<section class="schedule-manager-row" data-schedule-row="${escapeHtml(entry.id)}">
          <label>Nume<input data-schedule-name="${escapeHtml(entry.id)}" maxlength="60" value="${escapeHtml(entry.name)}"></label>
          <label>Accent<select data-schedule-accent="${escapeHtml(entry.id)}">${SCHEDULE_ACCENTS.map(color=>`<option value="${color}" ${entry.accent===color?'selected':''}>${CARD_TONE_LABELS[color]}</option>`).join('')}</select></label>
          <div class="schedule-manager-actions">${entry.id===activeScheduleId?'<span class="schedule-manager-active">Se editează</span>':`<button type="button" data-schedule-edit="${escapeHtml(entry.id)}">Editează</button>`}<button type="button" data-schedule-gemini="${escapeHtml(entry.id)}">Upload Gemini</button>${scheduleBook.schedules.length>1?`<button type="button" data-schedule-delete="${escapeHtml(entry.id)}">Șterge</button>`:''}</div>
        </section>`).join('')}</div>
        <button class="hub-primary schedule-add-button" type="button" data-schedule-add>＋ Adaugă încă un orar</button>`;
    }

    const saveHeaderField=(element,field)=>{
      data[field]=(element.textContent||'').replace(/\n+/g,' ').trimStart();
      saveData('Antet salvat');
    };
    [scheduleTitle,scheduleSubtitle].forEach((element,index)=>{
      const field=index===0?'title':'subtitle';
      element.addEventListener('focus',()=>{if(editing && !element.dataset.undoCaptured){recordUndo();element.dataset.undoCaptured='1';}});
      element.addEventListener('input',()=>saveHeaderField(element,field));
      element.addEventListener('blur',()=>{data[field]=(element.textContent||'').replace(/\n+/g,' ').trim();element.textContent=data[field];saveData('Antet salvat');});
      element.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();element.blur();}});
    });

    scheduleViewBar.addEventListener('click',e=>{
      const combined=e.target.closest('[data-schedule-view="combined"]');
      if(combined){scheduleViewMode='combined';scheduleBook.view='combined';expandedKey=null;persistScheduleBook();render();animateSchedule();return;}
      const button=e.target.closest('[data-schedule-id]');if(button)switchActiveSchedule(button.dataset.scheduleId);
    });
    scheduleManagerToggle.addEventListener('click',()=>{renderScheduleManager();if(!scheduleManagerDialog.open)scheduleManagerDialog.showModal();});
    scheduleManagerDialog.addEventListener('click',e=>{
      if(e.target.closest('[data-schedule-manager-close]')){scheduleManagerDialog.close();return;}
      if(e.target.closest('[data-schedule-add]')){addBlankSchedule();renderScheduleManager();showToast('Orar nou adăugat');return;}
      const edit=e.target.closest('[data-schedule-edit]');if(edit){switchActiveSchedule(edit.dataset.scheduleEdit);scheduleManagerDialog.close();showToast('Acum editezi '+activeScheduleEntry().name);return;}
      const upload=e.target.closest('[data-schedule-gemini]');if(upload){window.dispatchEvent(new CustomEvent('orar-gemini-import-request',{detail:{scheduleId:upload.dataset.scheduleGemini}}));scheduleManagerDialog.close();return;}
      const del=e.target.closest('[data-schedule-delete]');if(del){
        if(scheduleBook.schedules.length<=1)return;
        const id=del.dataset.scheduleDelete,entry=scheduleBook.schedules.find(x=>x.id===id);
        if(!entry||!confirm('Ștergi orarul „'+entry.name+'”?'))return;
        scheduleBook.schedules=scheduleBook.schedules.filter(x=>x.id!==id);
        if(activeScheduleId===id){activeScheduleId=scheduleBook.schedules[0].id;data=scheduleBook.schedules[0].schedule;}
        scheduleViewMode='single';scheduleBook.activeId=activeScheduleId;scheduleBook.view='single';clearScheduleHistory();persistScheduleBook();render();renderScheduleManager();return;
      }
    });
    scheduleManagerDialog.addEventListener('input',e=>{
      const name=e.target.closest('[data-schedule-name]');if(!name)return;
      const entry=scheduleBook.schedules.find(x=>x.id===name.dataset.scheduleName);if(!entry)return;
      entry.name=String(name.value||'').replace(/\s+/g,' ').slice(0,60);persistScheduleBook();renderScheduleViewBar();
    });
    scheduleManagerDialog.addEventListener('change',e=>{
      const accent=e.target.closest('[data-schedule-accent]');if(accent){const entry=scheduleBook.schedules.find(x=>x.id===accent.dataset.scheduleAccent);if(entry&&SCHEDULE_ACCENTS.includes(accent.value)){entry.accent=accent.value;persistScheduleBook();render();}return;}

    });

    document.getElementById('weekToggle').addEventListener('click', () => selectWeek(oppositeWeek(selectedWeek)));
    undoToggle.addEventListener('click', undoLastChange);
    redoToggle.addEventListener('click', redoLastChange);
    cloudSyncButton.addEventListener('click',()=>{
      if(cloudSyncButton.disabled)return;
      cloudSyncButton.disabled=true;
      cloudSyncButton.textContent='Se sincronizează…';
      window.dispatchEvent(new CustomEvent('orar-cloud-sync-request'));
      setTimeout(()=>{
        if(!cloudSyncButton.disabled)return;
        cloudSyncButton.disabled=false;
        cloudSyncButton.textContent='Cloud sync';
      },8000);
    });
    window.addEventListener('orar-cloud-sync-result',event=>{
      cloudSyncButton.disabled=false;
      cloudSyncButton.textContent='Cloud sync';
      const detail=event.detail||{};
      showToast(detail.message||(detail.ok?'Sincronizare finalizată':'Sincronizarea nu a reușit'));
    });

    const blurScheduleEditor=()=>{
      const active=document.activeElement;
      if(!active)return;
      if(active===scheduleTitle||active===scheduleSubtitle||active.closest?.('#scheduleGrid')){
        try{active.blur();}catch{}
      }
    };
    const resetScheduleInteractionState=()=>{
      document.body.classList.toggle('editing',editing);
      [scheduleTitle,scheduleSubtitle].forEach(el=>{
        el.contentEditable=editing?'true':'false';
        el.setAttribute('aria-label',el===scheduleTitle?'Titlul orarului':'Subtitlul orarului');
        el.spellcheck=false;
        if(!editing)delete el.dataset.undoCaptured;
      });
      grid.querySelectorAll('.card-color-picker[open]').forEach(picker=>picker.open=false);
      if(gridMotion){try{gridMotion.cancel();}catch{}gridMotion=null;}
      try{grid.getAnimations({subtree:true}).forEach(animation=>animation.cancel());}catch{}
      grid.style.removeProperty('transform');
      grid.style.removeProperty('opacity');
      grid.style.removeProperty('pointer-events');
    };

    editToggle.addEventListener('click', () => {
      const leavingEdit=editing;
      if(leavingEdit){
        blurScheduleEditor();
        saveData('Salvat');
      }
      if(!editing && scheduleViewMode==='combined'){scheduleViewMode='single';scheduleBook.view='single';}
      editing = !editing;
      expandedKey = null;
      resetScheduleInteractionState();
      editToggle.setAttribute('aria-pressed', String(editing));
      editToggle.setAttribute('aria-label', editing ? 'Salvează și revino la modul vizualizare' : 'Activează modul de editare');
      editToggle.title = editing ? 'Salvează' : 'Editează orarul';
      render();
      requestAnimationFrame(()=>{
        resetScheduleInteractionState();
        animateSchedule();
      });
      showToast(editing ? 'Mod editare activ' : 'Orarul a fost salvat');
      if(!editing && pendingAppUpdate) location.reload();
    });

    mobileTabs.addEventListener('click', e => {
      const btn = e.target.closest('[data-day]');
      if(!btn) return;
      const nextDay = Number(btn.dataset.day);
      if(selectedDay === nextDay) return;
      changeDay(nextDay);
    });



    let lastCompactOverlapView=isCompactOverlapView();
    let lastLandscapePhone=isLandscapePhone();
    let orientationRecoveryTimer=0;

    /* iOS Home Screen can keep the pre-rotation touch map even after it paints
       the portrait layout correctly. After the first real orientation change,
       verify each tap against the element's VISUAL bounding box. If WebKit
       targeted an element whose box is elsewhere, route the tap to the visible
       control under the finger. Normal taps are left completely untouched. */
    let iosVisualTapRepairActive=false;
    let iosRepairTouch=null;
    const iosTapSelector='button:not([disabled]),a[href],input:not([type="hidden"]):not([disabled]),select:not([disabled]),textarea:not([disabled]),[role="button"]:not([aria-disabled="true"])';
    const pointInRect=(rect,x,y,pad=1)=>x>=rect.left-pad&&x<=rect.right+pad&&y>=rect.top-pad&&y<=rect.bottom+pad;
    const visualTapTarget=(x,y)=>{
      const matches=[];
      document.querySelectorAll(iosTapSelector).forEach(el=>{
        if(el.closest('[inert]'))return;
        const style=getComputedStyle(el);
        if(style.display==='none'||style.visibility==='hidden'||style.pointerEvents==='none'||Number(style.opacity)===0)return;
        const rect=el.getBoundingClientRect();
        if(rect.width<2||rect.height<2||!pointInRect(rect,x,y,0))return;
        matches.push({el,area:rect.width*rect.height});
      });
      matches.sort((a,b)=>a.area-b.area);
      return matches[0]?.el||null;
    };
    if(iosStandaloneWebKit){
      window.addEventListener('touchstart',event=>{
        if(!iosVisualTapRepairActive||event.touches.length!==1){iosRepairTouch=null;return;}
        const t=event.touches[0];
        iosRepairTouch={x:t.clientX,y:t.clientY,time:performance.now(),moved:false};
      },{capture:true,passive:true});
      window.addEventListener('touchmove',event=>{
        if(!iosRepairTouch||!event.touches.length)return;
        const t=event.touches[0];
        if(Math.hypot(t.clientX-iosRepairTouch.x,t.clientY-iosRepairTouch.y)>10)iosRepairTouch.moved=true;
      },{capture:true,passive:true});
      window.addEventListener('touchend',event=>{
        const state=iosRepairTouch;iosRepairTouch=null;
        if(!iosVisualTapRepairActive||!state||state.moved||performance.now()-state.time>700||event.changedTouches.length!==1)return;
        const t=event.changedTouches[0],x=t.clientX,y=t.clientY;
        const nativeTarget=event.target?.closest?.(iosTapSelector)||null;
        if(nativeTarget){
          const rect=nativeTarget.getBoundingClientRect();
          if(pointInRect(rect,x,y,3))return;
        }
        const intended=visualTapTarget(x,y);
        if(!intended||intended===nativeTarget)return;
        event.preventDefault();
        event.stopImmediatePropagation();
        try{
          if(intended.matches('input,textarea,select')){
            intended.focus({preventScroll:true});
            if(typeof intended.showPicker==='function'){
              try{intended.showPicker();}catch{}
            }else intended.click();
          }else intended.click();
        }catch{}
      },{capture:true,passive:false});
    }
    const recoverScheduleAfterRotation=()=>{
      clearTimeout(orientationRecoveryTimer);
      if(iosStandaloneWebKit)iosVisualTapRepairActive=true;
      orientationRecoveryTimer=setTimeout(()=>{
        const appScroller=document.querySelector('.app');
        const previousScrollTop=appScroller?.scrollTop||0;
        blurScheduleEditor();
        try{window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0;}catch{}
        resetScheduleInteractionState();
        render();
        updateUndoButton();
        requestAnimationFrame(()=>{
          resetScheduleInteractionState();
          try{grid.getAnimations({subtree:true}).forEach(animation=>animation.cancel());}catch{}
          grid.querySelectorAll('.class-card,.slot-cell').forEach(node=>{
            node.style.removeProperty('transform');
            node.style.removeProperty('translate');
          });
          appScroller?.scrollTo({top:previousScrollTop,left:0,behavior:'auto'});
          void grid.offsetHeight;
          void scheduleFloatingControls.offsetHeight;
          window.dispatchEvent(new CustomEvent('orar-orientation-recover'));
        });
      },320);
    };
    window.addEventListener('orientationchange',recoverScheduleAfterRotation,{passive:true});
    window.addEventListener('resize',()=>{
      const nextCompactOverlapView=isCompactOverlapView();
      const nextLandscapePhone=isLandscapePhone();
      const layoutModeChanged=nextCompactOverlapView!==lastCompactOverlapView;
      const orientationChanged=nextLandscapePhone!==lastLandscapePhone;
      lastCompactOverlapView=nextCompactOverlapView;
      lastLandscapePhone=nextLandscapePhone;
      if(orientationChanged){recoverScheduleAfterRotation();return;}
      if(layoutModeChanged&&!editing)render();
    },{passive:true});

    scheduleTitle.textContent=data.title;
    scheduleSubtitle.textContent=data.subtitle;
    updateUndoButton();
    render();

    if(window.OrarStudentHub) window.OrarStudentHub.init({
      getSchedule:()=>clone(data),
      applySchedule:next=>applyScheduleToId(activeScheduleId,next),
      getSchedules:()=>getScheduleTargets(),
      getScheduleById:id=>clone(scheduleById(id)||data),
      applyScheduleTo:(id,next)=>applyScheduleToId(id,next)
    });

    let pendingAppUpdate = false;
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        const hadController = Boolean(navigator.serviceWorker.controller);
        let reloading = false;
        const reloadForUpdate=()=>{
          if(reloading)return;
          if(editing){pendingAppUpdate=true;return;}
          reloading=true;
          location.reload();
        };
        const checkPublishedVersion=async()=>{
          try{
            const response=await fetch('./sw.js?orar-version='+Date.now(),{cache:'no-store',credentials:'same-origin'});
            if(!response.ok)return;
            const source=await response.text(),match=source.match(/const\s+CACHE\s*=\s*['"]([^'"]+)['"]/);
            const version=match?.[1]||'';if(!version)return;
            const key='orar_published_version_v1',previous=localStorage.getItem(key);
            localStorage.setItem(key,version);
            if(previous&&previous!==version)reloadForUpdate();
          }catch{}
        };
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if(!hadController) return;
          reloadForUpdate();
        });
        navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}).then(registration => {
          registration.update().catch(() => {});
          checkPublishedVersion();
          document.addEventListener('visibilitychange', () => {
            if(document.visibilityState === 'visible'){
              registration.update().catch(() => {});
              checkPublishedVersion();
            }
          });
        }).catch(() => {});
      });
    }

  })();
  </script>
</body>
